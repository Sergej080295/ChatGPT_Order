<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlanCore · Вход</title>
<link rel="stylesheet" href="plan-core.css" />
<script defer src="plan-core.js"></script>
<style>
  :root {
    color-scheme: light dark;
  }

  body {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(32px, 6vw, 72px) 16px;
    background: radial-gradient(140% 140% at 15% 10%, rgba(255, 226, 149, 0.4), transparent 55%),
                radial-gradient(120% 120% at 85% 25%, rgba(255, 190, 105, 0.35), transparent 60%),
                var(--pc-surface-subtle);
    overflow: hidden;
  }

  body::before,
  body::after {
    content: '';
    position: absolute;
    inset: auto;
    pointer-events: none;
    border-radius: 999px;
    filter: blur(0px);
    opacity: 0.55;
  }

  body::before {
    width: 420px;
    height: 420px;
    top: -160px;
    right: -120px;
    background: radial-gradient(circle at 30% 30%, rgba(255, 214, 102, 0.55), rgba(255, 255, 255, 0));
  }

  body::after {
    width: 460px;
    height: 460px;
    bottom: -200px;
    left: -140px;
    background: radial-gradient(circle at 65% 35%, rgba(255, 223, 148, 0.55), rgba(255, 255, 255, 0));
  }

  .auth-card {
    position: relative;
    width: min(440px, 100%);
    padding: clamp(28px, 5vw, 48px) clamp(24px, 4vw, 40px);
    border-radius: 28px;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.72));
    border: 1px solid color-mix(in srgb, var(--pc-border-subtle) 70%, transparent);
    box-shadow: 0 22px 48px -28px rgba(15, 23, 42, 0.32);
    display: flex;
    flex-direction: column;
    gap: clamp(24px, 4vw, 36px);
    backdrop-filter: blur(18px);
  }

  body.theme-dark .auth-card {
    background: linear-gradient(135deg, rgba(26, 23, 17, 0.94), rgba(18, 17, 14, 0.88));
    border-color: rgba(240, 198, 83, 0.28);
    box-shadow: 0 26px 54px -30px rgba(0, 0, 0, 0.7);
  }

  .auth-card__header {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    text-align: center;
  }

  .auth-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: min(360px, 100%);
    height: 104px;
  }

  .auth-logo__image {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .auth-logo__image--dark {
    display: none;
  }

  body.theme-dark .auth-logo__image--light {
    display: none;
  }

  body.theme-dark .auth-logo__image--dark {
    display: block;
  }

  .auth-card__subtitle {
    margin: 0;
    color: color-mix(in srgb, var(--pc-text-muted) 85%, transparent);
    font-size: 0.98rem;
    line-height: 1.45;
    max-width: 28ch;
  }

  .auth-card__title {
    margin: 0;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--pc-text-strong);
  }

  .auth-form {
    display: flex;
    flex-direction: column;
    gap: clamp(18px, 3vw, 22px);
  }

  .auth-form label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-weight: 600;
    color: var(--pc-text-muted);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-size: 0.75rem;
  }

  .auth-form input {
    padding: 14px 18px;
    border-radius: 16px;
    border: 1.5px solid color-mix(in srgb, var(--pc-border-strong) 60%, transparent);
    background: color-mix(in srgb, var(--pc-surface-base) 88%, rgba(255,255,255,0.9));
    font-size: 1rem;
    color: var(--pc-text-base);
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    box-shadow: inset 0 1px 3px rgba(15, 23, 42, 0.08);
  }

  .auth-form input:focus {
    outline: none;
    border-color: color-mix(in srgb, var(--pc-accent-primary) 70%, transparent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--pc-accent-primary) 22%, transparent);
    background: color-mix(in srgb, var(--pc-surface-base) 94%, rgba(255,255,255,0.96));
  }

  body.theme-dark .auth-card__subtitle,
  body.theme-dark .auth-footer {
    color: #D9CCAA;
  }

  body.theme-dark .auth-form label {
    color: #F0C653;
  }

  body.theme-dark .auth-form input {
    background: rgba(15, 14, 12, 0.94);
    border-color: rgba(240, 198, 83, 0.44);
    color: #FFF4D8;
    box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
  }

  body.theme-dark .auth-form input:focus {
    background: rgba(22, 20, 16, 0.98);
    border-color: rgba(240, 198, 83, 0.8);
    box-shadow: 0 0 0 4px rgba(240, 198, 83, 0.2);
  }

  body.theme-dark .auth-guest {
    background: rgba(255, 244, 216, 0.05);
    color: #FFF4D8;
    border-color: rgba(240, 198, 83, 0.42);
  }

  body.theme-dark .auth-guest:hover {
    background: rgba(240, 198, 83, 0.12);
  }

  body.theme-dark .auth-meta span {
    background: rgba(255, 244, 216, 0.08);
    color: #D9CCAA;
  }

  body.theme-dark .auth-meta strong {
    color: #FFF4D8;
  }

  .auth-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .auth-submit {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 14px 24px;
    border: none;
    border-radius: 999px;
    font-size: 1.05rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    background: linear-gradient(135deg, var(--pc-accent-primary), color-mix(in srgb, var(--pc-accent-primary) 82%, #fff 18%));
    color: var(--pc-accent-on-primary);
    box-shadow: 0 16px 30px -20px color-mix(in srgb, var(--pc-accent-primary) 80%, transparent);
  }

  .auth-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 20px 36px -22px color-mix(in srgb, var(--pc-accent-primary) 88%, transparent);
  }

  .auth-submit:disabled {
    opacity: 0.65;
    cursor: progress;
    transform: none;
    box-shadow: none;
  }

  .auth-guest {
    background: transparent;
    color: var(--pc-text-base);
    border: 1px solid color-mix(in srgb, var(--pc-border-strong) 65%, transparent);
    box-shadow: none;
  }

  .auth-guest:hover {
    background: color-mix(in srgb, var(--pc-border-strong) 10%, transparent);
  }

  .auth-error {
    display: none;
    padding: 12px 16px;
    border-radius: 16px;
    border: 1px solid rgba(220, 53, 69, 0.18);
    background: rgba(220, 53, 69, 0.08);
    color: #d93025;
    font-size: 0.95rem;
    line-height: 1.4;
  }

  .auth-meta {
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 0.88rem;
    color: var(--pc-text-muted);
    flex-wrap: wrap;
  }

  .auth-meta span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--pc-surface-subtle) 60%, transparent);
  }

  .auth-meta strong {
    color: var(--pc-text-base);
  }

  .auth-footer {
    text-align: center;
    color: color-mix(in srgb, var(--pc-text-muted) 80%, transparent);
    font-size: 0.85rem;
  }

  @media (max-width: 520px) {
    body::before,
    body::after {
      display: none;
    }

    .auth-card {
      padding: 28px 22px;
      border-radius: 22px;
      box-shadow: 0 16px 30px -24px rgba(15, 23, 42, 0.3);
    }

    .auth-logo {
      height: 86px;
    }
  }
</style>
</head>
<body>
<main class="auth-card" data-animate="fade-in">
  <header class="auth-card__header">
    <div class="auth-logo" aria-hidden="true">
      <img class="auth-logo__image auth-logo__image--light" src="assets/planecore-logo-light.png" alt="" />
      <img class="auth-logo__image auth-logo__image--dark" src="assets/planecore-logo-dark.png" alt="" />
    </div>
    <h1 class="auth-card__title">Вход в PlanCore</h1>
    <p class="auth-card__subtitle">Укажите учетные данные или воспользуйтесь гостевым режимом просмотра</p>
  </header>
  <form class="auth-form" id="loginForm" novalidate>
    <div class="auth-error" id="loginError" role="alert"></div>
    <label for="loginInput">Логин
      <input id="loginInput" name="login" type="text" autocomplete="username" required />
    </label>
    <label for="passwordInput">Пароль
      <input id="passwordInput" name="password" type="password" autocomplete="current-password" required />
    </label>
    <div class="auth-actions">
      <button type="submit" class="auth-submit" id="loginSubmit">Войти</button>
      <button type="button" class="auth-submit auth-guest" id="guestBtn" hidden>Войти как гость</button>
    </div>
  </form>
  <footer class="auth-footer">
    <div class="auth-meta" id="authMeta"></div>
  </footer>
</main>
<script>
(() => {
  const form = document.getElementById('loginForm');
  const loginInput = document.getElementById('loginInput');
  const passwordInput = document.getElementById('passwordInput');
  const submitBtn = document.getElementById('loginSubmit');
  const guestBtn = document.getElementById('guestBtn');
  const errorBox = document.getElementById('loginError');
  const metaBox = document.getElementById('authMeta');

  const setLoading = (loading) => {
    submitBtn.disabled = loading;
    if (guestBtn) {
      guestBtn.disabled = loading;
    }
  };

  const showError = (message) => {
    if (!errorBox) return;
    if (message) {
      errorBox.textContent = message;
      errorBox.style.display = 'block';
    } else {
      errorBox.textContent = '';
      errorBox.style.display = 'none';
    }
  };

  const updateMeta = (info) => {
    if (!metaBox) return;
    const parts = [];
    if (info?.authMode) {
      const label = info.authMode === 'local' ? 'SQL' : String(info.authMode).toUpperCase();
      parts.push(`<span>Режим: <strong>${label}</strong></span>`);
    }
    if (info?.allowGuest) {
      parts.push('<span>Гостевой доступ включён</span>');
    }
    metaBox.innerHTML = parts.join('·');
  };

  const handleResponse = async (res) => {
    if (res.ok) {
      window.location.href = '/';
      return;
    }
    let message = 'Не удалось выполнить запрос';
    try {
      const payload = await res.json();
      if (payload && typeof payload.error === 'string') {
        message = payload.error;
      }
    } catch (_err) {
      /* ignore parse errors */
    }
    showError(message);
  };

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    showError('');
    const login = loginInput.value.trim();
    const password = passwordInput.value;
    if (!login || !password) {
      showError('Укажите логин и пароль');
      return;
    }
    setLoading(true);
    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login, password })
      });
      await handleResponse(res);
    } catch (err) {
      console.error('Login failed', err);
      showError('Не удалось связаться с сервером');
    } finally {
      setLoading(false);
    }
  });

  if (guestBtn) {
    guestBtn.addEventListener('click', async () => {
      showError('');
      setLoading(true);
      try {
        const res = await fetch('/auth/guest', { method: 'POST' });
        await handleResponse(res);
      } catch (err) {
        console.error('Guest login failed', err);
        showError('Не удалось выполнить гостевой вход');
      } finally {
        setLoading(false);
      }
    });
  }

  const bootstrap = async () => {
    try {
      const res = await fetch('/me');
      if (!res.ok) return;
      const payload = await res.json();
      if (payload?.user) {
        window.location.href = '/';
        return;
      }
      if (guestBtn && payload?.allowGuest) {
        guestBtn.hidden = false;
      }
      updateMeta(payload);
    } catch (_err) {
      /* ignore bootstrap errors */
    }
  };

  bootstrap();
})();
</script>
</body>
</html>
