<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CRM — управление состоянием планировщика</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { margin:0; background:#0f172a0d; color:#0f172a; }
    header { background:#0ea5e9; color:#fff; padding:16px 24px; }
    header h1 { margin:0; font-size:22px; font-weight:600; }
    main { padding:24px; max-width:960px; margin:0 auto; }
    section { background:#fff; border-radius:12px; padding:20px 24px; margin-bottom:24px; box-shadow:0 10px 25px -20px rgba(14,116,144,.5); }
    h2 { margin:0 0 12px; font-size:18px; }
    label { display:block; font-weight:600; margin-bottom:4px; }
    input, select { width:100%; border-radius:8px; border:1px solid #bae6fd; padding:10px 12px; font-size:14px; }
    textarea { width:100%; border-radius:8px; border:1px solid #bae6fd; padding:10px 12px; font-size:14px; min-height:120px; resize:vertical; }
    button { appearance:none; border:none; border-radius:999px; padding:10px 20px; background:#0ea5e9; color:#fff; font-weight:600; font-size:14px; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; }
    button:hover { transform:translateY(-1px); box-shadow:0 12px 20px -18px rgba(14,165,233,.8); }
    .danger { background:#ef4444; }
    .muted { background:#475569; }
    .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); }
    .metric { background:#e0f2fe; padding:12px 16px; border-radius:10px; font-size:14px; }
    pre { background:#0f172a; color:#e2e8f0; padding:14px; border-radius:10px; font-size:13px; overflow:auto; max-height:320px; }
    .log { background:#0f172a; color:#e2e8f0; border-radius:10px; padding:12px 16px; max-height:220px; overflow-y:auto; font-size:13px; font-family:ui-monospace, SFMono-Regular, SFMono, Menlo, monospace; }
    .status-ok { color:#15803d; font-weight:600; }
    .status-warn { color:#b45309; font-weight:600; }
  </style>
</head>
<body>
  <header>
    <h1>CRM — отправка изменений в планировщик</h1>
  </header>
  <main>
    <section>
      <h2>Сводка по состоянию</h2>
      <div class="grid" style="margin-bottom:16px;">
        <div class="metric"><div>Ревизия</div><strong id="rev">—</strong></div>
        <div class="metric"><div>ETag</div><strong id="etag">—</strong></div>
        <div class="metric"><div>Последний ответ</div><strong id="last-response">—</strong></div>
      </div>
      <div style="display:flex; gap:12px; flex-wrap:wrap;">
        <button type="button" id="btn-full">Получить снимок</button>
        <button type="button" id="btn-delta">Получить дельту</button>
      </div>
      <pre id="state-view">Загрузка…</pre>
    </section>

    <section>
      <h2>Обновить стадию заказа</h2>
      <p>CRM обновляет прогресс конкретной стадии. При конфликте выполняется автоматическая повторная попытка.</p>
      <form id="form-stage" class="grid">
        <div>
          <label for="stage-id">ID стадии *</label>
          <input id="stage-id" name="id" type="number" min="1" required placeholder="например, 123" />
        </div>
        <div>
          <label for="stage-progress">Прогресс, %</label>
          <input id="stage-progress" name="progress" type="number" min="0" max="100" placeholder="75" />
        </div>
        <div>
          <label for="stage-status">Статус</label>
          <input id="stage-status" name="status" placeholder="Выполняется" />
        </div>
        <div>
          <label for="stage-done">Готово?</label>
          <select id="stage-done" name="is_done">
            <option value="">—</option>
            <option value="true">Да</option>
            <option value="false">Нет</option>
          </select>
        </div>
      </form>
      <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap;">
        <button type="button" id="btn-save-stage">Сохранить стадию</button>
        <button type="button" id="btn-clear-stage" class="muted">Очистить форму</button>
      </div>
      <p id="stage-status-msg"></p>
    </section>

    <section>
      <h2>Удалить заказ</h2>
      <div class="grid">
        <div>
          <label for="delete-order-id">ID заказа *</label>
          <input id="delete-order-id" type="number" min="1" placeholder="42" />
        </div>
      </div>
      <div style="margin-top:16px; display:flex; gap:12px; flex-wrap:wrap;">
        <button type="button" id="btn-delete-order" class="danger">Удалить</button>
      </div>
      <p id="delete-status"></p>
    </section>

    <section>
      <h2>Журнал (SSE)</h2>
      <div class="log" id="crm-log"></div>
    </section>
  </main>

  <script>
    (() => {
      const view = document.getElementById('state-view');
      const revEl = document.getElementById('rev');
      const etagEl = document.getElementById('etag');
      const lastResponseEl = document.getElementById('last-response');
      const logEl = document.getElementById('crm-log');
      const stageMsg = document.getElementById('stage-status-msg');
      const deleteMsg = document.getElementById('delete-status');

      let lastRev = 0;
      let lastEtag = null;
      let lastDeltaSince = 0;

      const updateIndicators = () => {
        revEl.textContent = lastRev;
        etagEl.textContent = lastEtag || '—';
      };

      const log = (text, kind = 'info') => {
        const line = document.createElement('div');
        line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
        if (kind === 'ok') line.classList.add('status-ok');
        if (kind === 'warn') line.classList.add('status-warn');
        logEl.prepend(line);
        while (logEl.children.length > 50) {
          logEl.removeChild(logEl.lastChild);
        }
      };

      const loadFull = async () => {
        const res = await fetch('/api/state');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        lastRev = json.rev || 0;
        lastEtag = json.etag || null;
        lastDeltaSince = lastRev;
        updateIndicators();
        view.textContent = JSON.stringify(json.data, null, 2);
        lastResponseEl.textContent = 'полный снимок';
        log(`Получен полный снимок rev=${lastRev}`, 'ok');
      };

      const loadDelta = async () => {
        const res = await fetch(`/api/state?since_rev=${encodeURIComponent(lastDeltaSince)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        lastRev = json.rev || lastRev;
        lastEtag = json.etag || lastEtag;
        updateIndicators();
        view.textContent = JSON.stringify(json.delta, null, 2);
        lastResponseEl.textContent = `дельта rev>${lastDeltaSince}`;
        lastDeltaSince = lastRev;
        log(`Получена дельта rev>${lastDeltaSince}`, 'ok');
      };

      const sendChanges = async (changes, meta = {}) => {
        const payload = {
          base_rev: lastRev,
          actor: meta.actor || 'crm-ui',
          source: meta.source || 'crm',
          summary: meta.summary,
          forceOverwrite: meta.forceOverwrite === true,
          changes
        };

        const attempt = async (no) => {
          const res = await fetch('/api/changes', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'If-Match': lastEtag || `W/"r${lastRev}"`
            },
            body: JSON.stringify(payload)
          });
          if (res.status === 409 || res.status === 412) {
            if (no === 0) {
              log('Конфликт — перезагружаем и повторяем', 'warn');
              await loadFull();
              payload.base_rev = lastRev;
              return attempt(1);
            }
            const detail = await res.json().catch(() => ({ error: 'Conflict' }));
            throw new Error(detail.error || 'Conflict');
          }
          if (!res.ok) {
            const detail = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
            throw new Error(detail.error || `HTTP ${res.status}`);
          }
          const json = await res.json();
          lastRev = json.rev || lastRev;
          lastEtag = json.etag || lastEtag;
          updateIndicators();
          if (json.delta) {
            view.textContent = JSON.stringify(json.delta, null, 2);
            lastResponseEl.textContent = 'ответ сервера';
          }
          log(`Изменения сохранены, rev=${lastRev}`, 'ok');
          return json;
        };
        return attempt(0);
      };

      document.getElementById('btn-full').addEventListener('click', () => {
        loadFull().catch((err) => log(`Ошибка загрузки: ${err.message}`, 'warn'));
      });
      document.getElementById('btn-delta').addEventListener('click', () => {
        loadDelta().catch((err) => log(`Ошибка дельты: ${err.message}`, 'warn'));
      });

      document.getElementById('btn-save-stage').addEventListener('click', async () => {
        stageMsg.textContent = 'Отправка…';
        stageMsg.className = '';
        try {
          const form = new FormData(document.getElementById('form-stage'));
          const id = form.get('id');
          if (!id) {
            stageMsg.textContent = 'Укажите ID стадии';
            stageMsg.className = 'status-warn';
            return;
          }
          const payload = {
            stages: {
              upserts: [
                {
                  id: Number(id),
                  progressPct: form.get('progress') ? Number(form.get('progress')) : undefined,
                  status: form.get('status') || undefined,
                  isDone: form.get('is_done') === '' ? undefined : form.get('is_done') === 'true'
                }
              ]
            }
          };
          await sendChanges(payload, { summary: `stage ${id} from CRM` });
          stageMsg.textContent = 'Изменения сохранены';
          stageMsg.className = 'status-ok';
        } catch (err) {
          stageMsg.textContent = err.message;
          stageMsg.className = 'status-warn';
        }
      });

      document.getElementById('btn-clear-stage').addEventListener('click', () => {
        document.getElementById('form-stage').reset();
        stageMsg.textContent = '';
        stageMsg.className = '';
      });

      document.getElementById('btn-delete-order').addEventListener('click', async () => {
        deleteMsg.textContent = 'Удаляем…';
        deleteMsg.className = '';
        try {
          const idInput = document.getElementById('delete-order-id');
          const id = idInput.value ? Number(idInput.value) : null;
          if (!id) {
            deleteMsg.textContent = 'Укажите ID заказа';
            deleteMsg.className = 'status-warn';
            return;
          }
          await sendChanges({ orders: { deletes: [{ id }] } }, { summary: `delete order ${id}` });
          deleteMsg.textContent = 'Заказ удалён';
          deleteMsg.className = 'status-ok';
        } catch (err) {
          deleteMsg.textContent = err.message;
          deleteMsg.className = 'status-warn';
        }
      });

      const connectSse = () => {
        if (!('EventSource' in window)) return;
        const source = new EventSource('/api/events');
        source.onmessage = (event) => {
          if (!event.data) return;
          try {
            const payload = JSON.parse(event.data);
            if (payload.rev !== undefined) {
              lastRev = payload.rev;
              lastEtag = payload.etag || lastEtag;
              updateIndicators();
              log(`SSE rev=${payload.rev} ${payload.summary || ''}`);
            }
          } catch (err) {
            log(`Ошибка SSE: ${err.message}`, 'warn');
          }
        };
        source.onerror = () => {
          source.close();
          setTimeout(connectSse, 4000);
        };
      };

      loadFull().catch((err) => {
        view.textContent = `Ошибка загрузки: ${err.message}`;
      });
      connectSse();
    })();
  </script>
</body>
</html>
