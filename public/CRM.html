<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlanCore — CRM</title>
  <link rel="stylesheet" href="plan-core.css" />
  <script defer src="plan-core.js"></script>
  <script defer src="js/plancore-api.js"></script>
  <script defer src="js/order-dialog.js"></script>
  <script defer src="js/crm-app.js"></script>
</head>
<body data-section="crm">
  <header class="pc-header">
    <div class="pc-header__logo">
      <div class="pc-logo">PC</div>
      <div class="pc-header__title">
        <span class="pc-header__name">PlanCore</span>
        <span class="pc-header__tag">CRM</span>
      </div>
    </div>
    <nav class="pc-header__nav">
      <a class="pc-nav__link pc-nav__link--active" href="CRM.html" data-section="crm">CRM</a>
      <a class="pc-nav__link" href="Planner_Codex_v3.html" data-section="planner">Планировщик</a>
    </nav>
    <div class="pc-header__actions">
      <button class="pc-icon-btn" type="button" data-action="toggle-theme" aria-label="Переключить тему">
        <span class="pc-icon pc-icon--sun"></span>
      </button>
    </div>
  </header>

  <main class="pc-main">
    <section class="pc-toolbar">
      <div class="pc-toolbar__primary">
        <h1 class="pc-page-title">CRM заказы</h1>
        <label class="pc-field pc-field--search">
          <span class="pc-field__icon pc-icon pc-icon--search"></span>
          <input id="crm-search" class="pc-input" type="search" placeholder="Поиск заказов" autocomplete="off" />
        </label>
      </div>
      <div class="pc-toolbar__actions">
        <div class="pc-counter" id="crm-counter">0 заказов</div>
        <button id="crm-create" class="pc-btn pc-btn--primary" type="button">+ Заказ</button>
      </div>
    </section>

    <section class="pc-board" id="crm-board" data-animate="fade-in"></section>
  </main>

  <dialog id="order-dialog" class="pc-dialog" aria-modal="true">
    <form method="dialog" class="pc-dialog__content">
      <header class="pc-dialog__header">
        <h2 class="pc-dialog__title">Заказ</h2>
        <button type="button" class="pc-icon-btn" data-close>
          <span class="pc-icon pc-icon--close"></span>
        </button>
      </header>
      <div class="pc-dialog__body">
        <div class="pc-grid pc-grid--two">
          <label class="pc-field">
            <span class="pc-field__label">Название</span>
            <input class="pc-input" name="title" required />
          </label>
          <label class="pc-field">
            <span class="pc-field__label">Номер</span>
            <input class="pc-input" name="number" />
          </label>
          <label class="pc-field">
            <span class="pc-field__label">Клиент</span>
            <input class="pc-input" name="customer" />
          </label>
          <label class="pc-field">
            <span class="pc-field__label">Статус</span>
            <input class="pc-input" name="status" />
          </label>
          <label class="pc-field">
            <span class="pc-field__label">Приоритет</span>
            <input class="pc-input" name="priority" />
          </label>
          <label class="pc-field">
            <span class="pc-field__label">Ответственный</span>
            <input class="pc-input" name="manager" />
          </label>
          <label class="pc-field">
            <span class="pc-field__label">План. старт</span>
            <input class="pc-input" name="plannedStart" type="datetime-local" />
          </label>
          <label class="pc-field">
            <span class="pc-field__label">План. окончание</span>
            <input class="pc-input" name="plannedFinish" type="datetime-local" />
          </label>
          <label class="pc-field">
            <span class="pc-field__label">Срок</span>
            <input class="pc-input" name="dueDate" type="datetime-local" />
          </label>
          <label class="pc-field">
            <span class="pc-field__label">Готовность, %</span>
            <input class="pc-input" name="readyPercent" type="number" min="0" max="100" step="1" />
          </label>
        </div>
        <label class="pc-field">
          <span class="pc-field__label">Заметки</span>
          <textarea class="pc-textarea" name="notes" rows="3"></textarea>
        </label>
        <section>
          <header class="pc-section-head">
            <h3>Переделы</h3>
            <button type="button" class="pc-btn pc-btn--secondary" data-add-stage>+ Добавить передел</button>
          </header>
          <div class="pc-stage-list" data-stage-list></div>
        </section>
      </div>
      <footer class="pc-dialog__footer">
        <button type="button" class="pc-btn pc-btn--danger" data-delete>Удалить</button>
        <div class="pc-spacer"></div>
        <button type="button" class="pc-btn pc-btn--secondary" data-close>Отмена</button>
        <button type="submit" class="pc-btn pc-btn--primary">Сохранить</button>
      </footer>
    </form>
  </dialog>

  <template id="stage-item-template">
    <div class="pc-stage-row" data-stage-row>
      <div class="pc-stage-row__title">
        <select class="pc-select" name="stageCode"></select>
      </div>
      <div class="pc-stage-row__fields">
        <label class="pc-field pc-field--inline">
          <span class="pc-field__label">Готовность %</span>
          <input class="pc-input" name="readyPercent" type="number" min="0" max="100" />
        </label>
        <label class="pc-field pc-field--inline">
          <span class="pc-field__label">Ожидание %</span>
          <input class="pc-input" name="expectedPercent" type="number" min="0" max="100" />
        </label>
        <label class="pc-field pc-field--inline">
          <span class="pc-field__label">Статус</span>
          <input class="pc-input" name="status" />
        </label>
        <label class="pc-field pc-field--inline">
          <span class="pc-field__label">Исполнитель</span>
          <input class="pc-input" name="executor" />
        </label>
        <label class="pc-field pc-field--inline">
          <span class="pc-field__label">План. окончание</span>
          <input class="pc-input" name="plannedFinish" type="datetime-local" />
        </label>
        <button type="button" class="pc-icon-btn pc-icon-btn--ghost" data-remove>
          <span class="pc-icon pc-icon--trash"></span>
        </button>
      </div>
    </div>
  </template>
</body>
</html>
