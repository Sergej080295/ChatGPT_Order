<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlanCore CRM</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8f9fc;
        --panel: #ffffff;
        --border: #dfe3f1;
        --text: #1d2539;
        --accent: #5a6fff;
        --badge: rgba(90, 111, 255, 0.12);
        --badge-text: #3945b7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      header {
        padding: 1.5rem 2rem;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 2px 12px rgba(29, 37, 57, 0.06);
      }

      header h1 {
        margin: 0;
        font-size: 1.8rem;
        font-weight: 700;
      }

      main {
        padding: 2rem;
        display: grid;
        gap: 1.5rem;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }

      .card {
        background: var(--panel);
        border-radius: 1.1rem;
        padding: 1.25rem;
        border: 1px solid rgba(29, 37, 57, 0.07);
        box-shadow: 0 12px 30px rgba(29, 37, 57, 0.08);
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .card h2 {
        margin: 0;
        font-size: 1.1rem;
      }

      .lanes {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .lane {
        padding: 0.35rem 0.65rem;
        border-radius: 999px;
        background: var(--badge);
        color: var(--badge-text);
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      th,
      td {
        padding: 0.6rem 0.35rem;
        border-bottom: 1px solid var(--border);
        text-align: left;
      }

      th {
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.04em;
        color: rgba(29, 37, 57, 0.6);
      }

      tr:last-child td {
        border-bottom: none;
      }

      .empty {
        padding: 1rem;
        text-align: center;
        color: rgba(29, 37, 57, 0.6);
        border: 1px dashed rgba(29, 37, 57, 0.2);
        border-radius: 0.9rem;
        background: rgba(29, 37, 57, 0.03);
      }

      @media (max-width: 960px) {
        main {
          grid-template-columns: 1fr;
          padding: 1.25rem;
        }
        header {
          padding: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PlanCore CRM</h1>
    </header>
    <main>
      <section class="card">
        <h2>CRM-доски</h2>
        <div id="boards"></div>
        <div id="boards-empty" class="empty" hidden>Доски не найдены.</div>
      </section>
      <section class="card">
        <h2>Заказы и этапы</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Заказ</th>
                <th>CRM</th>
                <th>Доска</th>
                <th>Позиция</th>
                <th>Обновлено</th>
              </tr>
            </thead>
            <tbody id="meta-body"></tbody>
          </table>
          <div id="meta-empty" class="empty" hidden>Нет заказов в CRM.</div>
        </div>
      </section>
      <section class="card">
        <h2>Сводка заказов</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Номер</th>
                <th>Статус</th>
                <th>Обновлено</th>
              </tr>
            </thead>
            <tbody id="orders-body"></tbody>
          </table>
          <div id="orders-empty" class="empty" hidden>В базе пока нет заказов.</div>
        </div>
      </section>
    </main>

    <script>
      const boardsContainer = document.getElementById('boards');
      const boardsEmpty = document.getElementById('boards-empty');
      const metaBody = document.getElementById('meta-body');
      const metaEmpty = document.getElementById('meta-empty');
      const ordersBody = document.getElementById('orders-body');
      const ordersEmpty = document.getElementById('orders-empty');

      async function load() {
        try {
          const [boardsRes, metaRes, ordersRes] = await Promise.all([
            fetchJson('/api/crm/boards'),
            fetchJson('/api/crm/orders-meta'),
            fetchJson('/api/orders?limit=500')
          ]);
          renderBoards(boardsRes.items || []);
          renderMeta(metaRes.items || [], boardsRes.items || []);
          renderOrders(ordersRes.items || []);
        } catch (err) {
          console.error('Не удалось загрузить CRM данные', err);
          boardsContainer.innerHTML = '<div class="empty">Ошибка загрузки.</div>';
        }
      }

      function fetchJson(url) {
        return fetch(url).then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        });
      }

      function renderBoards(boards) {
        boardsContainer.innerHTML = '';
        if (!boards.length) {
          boardsEmpty.hidden = false;
          return;
        }
        boardsEmpty.hidden = true;
        boards.forEach((board) => {
          const wrapper = document.createElement('div');
          wrapper.innerHTML = `
            <h3 style="margin:0 0 0.5rem 0;font-size:1rem;">${board.name || board.id}</h3>
            <div class="lanes"></div>
            <div style="font-size:0.75rem;color:rgba(29,37,57,0.6);">Обновлено ${formatDate(board.updated_at)}</div>
          `;
          const lanesContainer = wrapper.querySelector('.lanes');
          (board.lanes || []).forEach((lane) => {
            const laneTag = document.createElement('span');
            laneTag.className = 'lane';
            laneTag.textContent = typeof lane === 'string' ? lane : lane?.name || 'Без названия';
            lanesContainer.appendChild(laneTag);
          });
          boardsContainer.appendChild(wrapper);
        });
      }

      function renderMeta(meta, boards) {
        metaBody.innerHTML = '';
        if (!meta.length) {
          metaEmpty.hidden = false;
          return;
        }
        metaEmpty.hidden = true;
        const boardMap = new Map((boards || []).map((board) => [board.id, board]));
        meta.forEach((entry) => {
          const tr = document.createElement('tr');
          const boardName = boardMap.get(entry.board_id)?.name || '—';
          tr.innerHTML = `
            <td>${entry.order_key || '—'}</td>
            <td>${entry.crm_order_id || '—'}</td>
            <td>${boardName}</td>
            <td>${Number.isFinite(entry.position) ? entry.position : '—'}</td>
            <td>${formatDate(entry.updated_at)}</td>
          `;
          metaBody.appendChild(tr);
        });
      }

      function renderOrders(orders) {
        ordersBody.innerHTML = '';
        if (!orders.length) {
          ordersEmpty.hidden = false;
          return;
        }
        ordersEmpty.hidden = true;
        orders.forEach((order) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${order.id}</td>
            <td>${order.number || order.crm_order_id || '—'}</td>
            <td>${order.status || '—'}</td>
            <td>${formatDate(order.updated_at)}</td>
          `;
          ordersBody.appendChild(tr);
        });
      }

      function formatDate(value) {
        if (!value) return '—';
        const date = new Date(value);
        if (Number.isNaN(date.valueOf())) return '—';
        return date.toLocaleString('ru-RU', {
          day: '2-digit',
          month: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      load();
    </script>
  </body>
</html>
