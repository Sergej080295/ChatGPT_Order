<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mini CRM v13c — Orders · Stages</title>
<script>
(() => {
  const STATE_ENDPOINT = '/api/state';
  const EVENTS_ENDPOINT = '/api/events';
  const listeners = new Set();
  let source = null;
  let currentEtag = null;
  let currentHash = null;

  const parseEtagHash = (value) => {
    if (!value || typeof value !== 'string') return null;
    const trimmed = value.trim();
    if (!trimmed || trimmed === '*') return null;
    const withoutWeak = trimmed.startsWith('W/') ? trimmed.slice(2) : trimmed;
    const stripped = withoutWeak.replace(/^"|"$/g, '');
    return stripped || null;
  };

  const updateFingerprint = ({ etag, hash }) => {
    let applied = false;
    if (etag && typeof etag === 'string') {
      const parsed = parseEtagHash(etag);
      if (parsed) {
        currentHash = parsed;
        currentEtag = etag.startsWith('W/') ? etag : `W/"${parsed}"`;
        applied = true;
      }
    }
    if (hash) {
      const normalized = String(hash).trim();
      if (normalized) {
        currentHash = normalized;
        if (!applied || !parseEtagHash(currentEtag || '')) {
          currentEtag = `W/"${normalized}"`;
        }
      }
    }
  };

  const extractBodyFingerprint = (text) => {
    if (!text || typeof text !== 'string') return null;
    const trimmed = text.trim();
    if (!trimmed) return null;
    try {
      const parsed = JSON.parse(trimmed);
      if (parsed && typeof parsed === 'object') {
        const bodyEtag = typeof parsed.etag === 'string' ? parsed.etag : null;
        const bodyHash = typeof parsed.hash === 'string' ? parsed.hash : null;
        if (bodyEtag || bodyHash) {
          updateFingerprint({ etag: bodyEtag, hash: bodyHash });
        }
        return { parsed, hash: bodyHash, etag: bodyEtag };
      }
    } catch (_err) {
      /* ignore */
    }
    return null;
  };

  window.PLANNER_STATE_ENDPOINT = STATE_ENDPOINT;
  window.PLANNER_STATE_METHOD = 'PUT';
  window.PLANNER_STATE_WRAP = true;

  const notify = (data) => {
    listeners.forEach(cb => {
      try {
        cb(data);
      } catch (err) {
        console.warn('plannerRemote listener failed', err);
      }
    });
  };

  const reconnectDelay = 3000;
  const connect = () => {
    if (!('EventSource' in window)) return;
    if (source) {
      try { source.close(); } catch (err) { /* ignore */ }
    }
    source = new EventSource(EVENTS_ENDPOINT);
    source.onmessage = (event) => {
      if (!event?.data) {
        notify(null);
        return;
      }
      try {
        const payload = JSON.parse(event.data);
        if (payload && typeof payload === 'object') {
          updateFingerprint({ etag: payload.etag, hash: payload.hash });
        }
        notify(payload);
      } catch (err) {
        console.warn('plannerRemote event parse failed', err);
        notify(null);
      }
    };
    source.onerror = () => {
      if (source) {
        try { source.close(); } catch (err) { /* ignore */ }
      }
      source = null;
      setTimeout(connect, reconnectDelay);
    };
  };

  if ('EventSource' in window) {
    connect();
  }

  const loadState = async (options = {}) => {
    const res = await fetch(STATE_ENDPOINT, { headers: { 'Accept': 'application/json,text/plain' } });
    if (!res.ok) {
      const detail = await res.text().catch(() => '');
      throw new Error(detail || `HTTP ${res.status}`);
    }
    const text = await res.text();
    const bodyInfo = extractBodyFingerprint(text);
    const etag = res.headers.get('ETag');
    updateFingerprint({ etag, hash: bodyInfo?.hash });
    if (options && (options.withMeta || options.returnMeta)) {
      return { state: text, etag: currentEtag, hash: currentHash };
    }
    return text;
  };

  const saveState = async (payload, meta) => {
    const stateString = typeof payload === 'string' ? payload : JSON.stringify(payload);
    if (!currentEtag && !currentHash) {
      try {
        await loadState();
      } catch (_err) {
        /* ignore */
      }
    }

    const metaIsObject = meta && typeof meta === 'object' && !Array.isArray(meta);
    const metaTemplate = metaIsObject ? { ...meta } : meta;

    const buildRequestPayload = () => {
      let metaPayload = null;
      let ifMatchHeader = null;
      if (metaIsObject) {
        const working = { ...metaTemplate };
        if (Object.prototype.hasOwnProperty.call(working, 'ifMatch')) {
          const explicit = working.ifMatch == null ? '' : String(working.ifMatch).trim();
          if (explicit) {
            ifMatchHeader = explicit;
          }
          delete working.ifMatch;
        }
        const providedBaseHash = working.baseHash == null ? '' : String(working.baseHash).trim();
        const providedBaseEtag = working.baseEtag == null ? '' : String(working.baseEtag).trim();
        if (currentHash && !providedBaseHash) working.baseHash = currentHash;
        if (currentEtag && !providedBaseEtag) working.baseEtag = currentEtag;
        const normalizedBaseEtag = working.baseEtag == null ? '' : String(working.baseEtag).trim();
        const normalizedBaseHash = working.baseHash == null ? '' : String(working.baseHash).trim();
        if (!ifMatchHeader) {
          if (normalizedBaseEtag) {
            ifMatchHeader = normalizedBaseEtag;
          } else if (normalizedBaseHash) {
            ifMatchHeader = `W/"${normalizedBaseHash}"`;
          }
        }
        if (!normalizedBaseHash) delete working.baseHash;
        if (!normalizedBaseEtag) delete working.baseEtag;
        if (working.forceOverwrite !== true) delete working.forceOverwrite;
        metaPayload = Object.keys(working).length > 0 ? working : null;
      } else if (meta !== undefined) {
        metaPayload = metaTemplate;
      }
      const headers = {
        'Content-Type': 'application/json',
        'Accept': 'application/json,text/plain'
      };
      const effectiveIfMatch = ifMatchHeader
        || (currentEtag ? currentEtag : currentHash ? `W/"${currentHash}"` : '*');
      headers['If-Match'] = effectiveIfMatch;
      const body = JSON.stringify({ state: stateString, meta: metaPayload });
      return { headers, body };
    };

    const attemptSave = async (attempt = 0) => {
      const { headers, body } = buildRequestPayload();
      const res = await fetch(STATE_ENDPOINT, {
        method: 'PUT',
        headers,
        body
      });
      const text = await res.text().catch(() => '') || '';
      const trimmed = text.trim();
      let parsed = null;
      if (trimmed) {
        try { parsed = JSON.parse(trimmed); }
        catch (_err) { parsed = null; }
      }
      if (!res.ok) {
        const err = new Error(parsed?.error || trimmed || `HTTP ${res.status}`);
        err.status = res.status;
        if (parsed !== null) {
          err.detail = parsed;
        } else if (trimmed) {
          err.detail = trimmed;
        }
        err.body = text;
        if (res.status === 409 && (parsed?.error === 'Conflict' || parsed?.error === 'CONFLICT')) {
          err.name = 'PlannerConflictError';
        }
        if (attempt === 0 && (err.status === 409 || err.status === 412 || err.status === 428)) {
          try {
            await loadState({ withMeta: true });
          } catch (_reloadErr) {
            /* ignore and retry with existing fingerprint */
          }
          return attemptSave(attempt + 1);
        }
        throw err;
      }
      updateFingerprint({ etag: res.headers.get('ETag'), hash: parsed?.hash });
      extractBodyFingerprint(text);
      if (!trimmed) return true;
      return parsed ?? text;
    };

    return attemptSave(0);
  };

  window.plannerRemote = {
    loadState,
    saveState,
    onRemoteUpdate(callback) {
      if (typeof callback !== 'function') return () => {};
      listeners.add(callback);
      return () => listeners.delete(callback);
    },
    applyFingerprint(payload) {
      if (payload && typeof payload === 'object') {
        updateFingerprint(payload);
      }
    },
    getFingerprint() {
      return { etag: currentEtag, hash: currentHash };
    }
  };
})();
</script>
<script>
(function bootstrapCrmSnapshot(){
  const KEY = 'mini_crm_v13c';
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', '/api/state', false);
    xhr.setRequestHeader('Accept', 'application/json,text/plain');
    xhr.send(null);
    if (xhr.status >= 200 && xhr.status < 300) {
      const etag = xhr.getResponseHeader('ETag');
      if (window.plannerRemote && typeof window.plannerRemote.applyFingerprint === 'function') {
        window.plannerRemote.applyFingerprint({ etag });
      }
      const raw = xhr.responseText || '';
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (window.plannerRemote && typeof window.plannerRemote.applyFingerprint === 'function') {
        window.plannerRemote.applyFingerprint({ etag, hash: parsed?.hash });
      }
      if (parsed && typeof parsed === 'object') {
        const muted = (() => {
          if (typeof parsed.notificationsMuted === 'boolean') return parsed.notificationsMuted;
          if (parsed.meta) {
            if (typeof parsed.meta.notificationsMuted === 'boolean') return parsed.meta.notificationsMuted;
            if (parsed.meta.settings && typeof parsed.meta.settings.notificationsMuted === 'boolean') {
              return parsed.meta.settings.notificationsMuted;
            }
          }
          if (parsed.settings && typeof parsed.settings.notificationsMuted === 'boolean') {
            return parsed.settings.notificationsMuted;
          }
          return undefined;
        })();
        if (muted !== undefined) {
          window.__CRM_NOTIFICATIONS_MUTED__ = !!muted;
        }
      }
      if (parsed && typeof parsed === 'object' && parsed.crm) {
        window.__CRM_INITIAL_STATE__ = parsed.crm;
        try {
          localStorage.setItem(KEY, JSON.stringify(parsed.crm));
        } catch (_err) {
          /* ignore */
        }
      }
    }
  } catch (err) {
    console.warn('CRM bootstrap failed', err);
  }
})();
</script>

  .section-toolbar .note{font-size:11px;color:var(--muted);}

  .form-footer{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:16px 18px;}
  .form-footer .status-field{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:220px;}
  .form-footer .status-field label{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-left:2px;}
  .form-footer .status-field select{width:100%;}
  .form-footer .actions{display:flex;align-items:center;gap:10px;margin-left:auto;}

  #orderForm textarea{width:100%;}
  #stagesTable input,#stagesTable select{padding:4px 6px;min-height:0;border-radius:10px;box-shadow:none;background:var(--inputBg);}
  #stagesTable select{background-image:none;padding-right:8px;}
  body[data-theme="light"] #stagesTable input,
  body[data-theme="light"] #stagesTable select{background:#fff;box-shadow:none;border-color:#d0d9ec;}
  #stagesTable input.crm-date-changed{box-shadow:inset 0 -2px 0 rgba(37,99,235,.6)}

  /* Таблица переделов */
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{border:1px solid var(--border);padding:3px 8px;vertical-align:middle}
  body[data-theme="light"] th,body[data-theme="light"] td{border-color:#e5eaf5}
  th{color:var(--muted);font-weight:600}
  #stagesTable th:first-child,#stagesTable td:first-child{text-align:left}
  #stagesTable th:not(:first-child),#stagesTable td:not(:first-child){text-align:center}
  #stagesTable td input,#stagesTable td select{width:100%}
  #stagesTable thead th:nth-child(1){width:29%}
  #stagesTable thead th:nth-child(2){width:7%}
  #stagesTable thead th:nth-child(3){width:12%}
  #stagesTable thead th:nth-child(4){width:18%}
  #stagesTable thead th:nth-child(5){width:18%}
  #stagesTable thead th:nth-child(6){width:12%}
  #stagesTable thead th:nth-child(7){width:4%}
  #stagesTable input[data-k="progress"]{max-width:76px;text-align:center;margin:auto}
  #stagesTable input[data-k="start"],#stagesTable input[data-k="end"]{max-width:136px;text-align:center;margin:auto}
  #stagesTable input[data-k="value"]{max-width:280px;width:100%;text-align:center;margin:auto}
  #stagesTable input.stg-name{padding:4px 6px}
  #stagesTable td.chk{padding:3px 8px}
  .progress-expected-cell{display:flex;align-items:center;justify-content:center;gap:6px}
  .progress-expected-cell .expected-indicator{font-size:12px;color:var(--muted)}
  .progress-expected-cell .expected-indicator.behind{color:#dc2626;font-weight:600}

  #orderForm details{grid-column:1 / -1}
  #orderForm details textarea{width:100%;resize:vertical}

  /* Кружки «Готово» (20px) */
  .ready-switch{
    appearance:none;aspect-ratio:1/1;width:20px!important;height:auto;
    border:2px solid var(--readyOffBd)!important;border-radius:50%;
    background:var(--readyOffBg);display:inline-grid;place-content:center;
    cursor:pointer;transition:border-color .15s,box-shadow .15s,background-color .15s;
    vertical-align:middle;box-sizing:content-box
  }
  .ready-switch:hover{box-shadow:0 0 0 3px rgba(77,163,255,.12) inset}
  .ready-switch::after{content:"";width:12px;height:12px;background-repeat:no-repeat;background-position:center;background-size:12px 12px;opacity:0;transition:.15s}
  .ready-switch:checked{border-color:var(--ok);background:radial-gradient(circle at 50% 50%,rgba(36,161,72,.16),rgba(36,161,72,.06));box-shadow:0 0 0 3px var(--okGlow) inset}
  .ready-switch:checked::after{opacity:1;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 14 14"><path d="M3 7l2.8 3L11 4.2" fill="none" stroke="%2324a148" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>')}
  .card .ready-switch.card-ready{margin-right:8px}

  .ready-btn{aspect-ratio:1/1;width:10px;height:auto;border:1.2px solid var(--readyOffBd);border-radius:50%;display:none}
  .btn-circle{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0}

  .popup{position:fixed;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:6px}
  .popup h4{margin:6px 8px;font-size:12px;color:var(--muted)}
  .popup .item{padding:6px 10px;border-radius:8px;cursor:pointer}
  .popup .item:hover{background:rgba(77,163,255,.12)}

  .toast-layer{position:fixed;top:20px;right:20px;z-index:11000;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
  .toast{min-width:220px;max-width:320px;background:rgba(17,24,38,.92);color:#f8fbff;border:1px solid rgba(92,160,255,.4);border-radius:14px;padding:12px 16px;box-shadow:0 18px 30px rgba(0,0,0,.35);font-size:13px;line-height:1.4;pointer-events:auto;display:grid;gap:6px}
  body[data-theme="light"] .toast{background:#ffffff;color:#0f172a;border-color:#d0e1ff;box-shadow:0 18px 30px rgba(27,92,255,.16)}
  .toast.success{border-color:rgba(52,199,89,.55);background:rgba(32,125,60,.92)}
  body[data-theme="light"] .toast.success{background:#ecfdf3;border-color:#bbf7d0;color:#166534}
  .toast.warn{border-color:rgba(250,204,21,.6);background:rgba(120,93,0,.9)}
  body[data-theme="light"] .toast.warn{background:#fef9c3;border-color:#fde68a;color:#854d0e}
  .toast.error{border-color:rgba(248,113,113,.6);background:rgba(127,29,29,.9)}
  body[data-theme="light"] .toast.error{background:#fee2e2;border-color:#fecaca;color:#7f1d1d}
  .toast strong{font-size:13px}
  .toast button{justify-self:flex-end;margin-top:4px}

  .planner-button{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:12px;border:1px solid rgba(92,160,255,.45);background:linear-gradient(135deg,rgba(77,163,255,.22),rgba(77,163,255,.08));color:#4da3ff;text-decoration:none;transition:transform .12s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease}
  .planner-button:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(77,163,255,.28);background:linear-gradient(135deg,rgba(77,163,255,.32),rgba(77,163,255,.14))}
  .planner-button:active{transform:translateY(0) scale(.98)}
  .planner-button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(77,163,255,.45)}
  .planner-button svg{width:18px;height:18px;fill:currentColor}
  body[data-theme="light"] .planner-button{background:linear-gradient(135deg,rgba(27,92,255,.22),rgba(27,92,255,.08));border-color:rgba(27,92,255,.45);color:#1b5cff}
  body[data-theme="light"] .planner-button:hover{box-shadow:0 8px 18px rgba(27,92,255,.18);background:linear-gradient(135deg,rgba(27,92,255,.3),rgba(27,92,255,.12))}

  .tt{position:fixed;z-index:9998;background:var(--tooltipBg);color:var(--text);border:1px solid var(--tooltipBd);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:12px;max-width:320px;pointer-events:none}
  .tt h5{margin:0 0 6px 0;font-size:12px;color:var(--muted)}
  .tt ul{margin:0;padding-left:16px}
  .tt li{margin:2px 0}
  
  #orderForm input[name="title"] {
    width: 100%;
  }

</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="title-area">
      <h1>Mini CRM</h1>
      <a id="plannerLink" class="planner-button" href="/Planner_Codex_v3.html" title="Открыть планировщик" aria-label="Открыть планировщик">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M5 4h2V2h2v2h6V2h2v2h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm14 6H5v10h14V10zm0-2V6H5v2h14z"/></svg>
      </a>
    </div>
    <div class="boards">
      <select id="boardSelect"></select>
      <span class="pill muted" id="stats">—</span>
    </div>
    <div class="actions">
      <button id="newOrderBtn" class="primary">+ Заказ</button>
      <button id="exportBtn" title="Экспорт JSON">⭳</button>
      <button id="importBtn" title="Импорт JSON">⭱</button>
      <input id="importInput" type="file" accept="application/json" hidden />
      <button id="themeBtn" title="Переключить тему">🌙</button>
    </div>
    <input id="q" class="search grow" type="text" placeholder="Поиск: № заказа, имя, переделы…" />
  </div>
</header>

<main><div class="columns" id="columns"></div></main>

<div id="toastLayer" class="toast-layer" aria-live="polite"></div>

<!-- Диалог заказа -->
<dialog id="orderDlg">
  <div class="dlg-head">
    <strong id="dlgTitle">Редактировать заказ</strong>
    <div class="rowc">
      <label class="rowc"><input id="orderDone" class="ready-switch" type="checkbox" /> Заказ готов</label>
      <button class="ghost" id="splitBtn" title="Разбить на подзаказ">➗ Подзаказ</button>
      <button class="ghost" onclick="closeOrder()">✖</button>
    </div>
  </div>
  <form id="orderForm" class="dlg-body" method="dialog">
    <div class="gridHead surface">
      <div class="title"><label>Название заказа</label><input name="title" required placeholder="ВЗПС-021612 АБХМ (Фортес Групп)" /></div>
      <div class="service"><label>Сумма услуг, ₽</label><input name="serviceTotal" type="text" inputmode="decimal" placeholder="0" /></div>
      <div class="start"><label>Начало (авто)</label><input name="start" type="date" disabled /></div>

      <div class="customer"><label>Клиент</label><input name="customer" placeholder="АБХМ" /></div>
      <div class="orderNo"><label>№ заказа</label><input name="orderNo" required placeholder="ВЗПС-021612" /></div>
      <div class="progressField"><label>Общий прогресс, %</label><input name="progress" type="number" min="0" max="100" value="0" disabled /></div>
      <div class="end"><label>Конец (авто)</label><input name="end" type="date" disabled /></div>
    </div>

    <details class="section-card surface" open>
      <summary>План переделов (статус, % выполнения, сроки, Руб/часов)</summary>
      <div class="section-body">
        <div class="list">
          <table id="stagesTable">
            <thead><tr><th>Передел</th><th>Готово</th><th>% вып.</th><th>Начало</th><th>Конец</th><th>Руб/часов</th><th></th></tr></thead>
          <tbody></tbody></table>

          <div class="section-toolbar">
            <div class="left">
              <label class="rowc"><input id="dateToday" type="checkbox" class="ready-switch" /> Даты=сегодня</label>
              <span class="note">Галочка «Готово» = 100% по переделу.</span>
            </div>
            <div class="right">
              <button type="button" id="addStageBtn">+ Передел</button>
              <button type="button" id="presetStagesBtn">🔁 Базовые</button>
            </div>
          </div>
        </div>
      </div>
    </details>
    <details class="section-card surface" open>
      <summary>Описание/исключения</summary>
      <div class="section-body">
        <textarea name="notes" rows="2" placeholder="Краткое ТЗ, исключения, кооперация…"></textarea>
      </div>
    </details>

    <div class="section-card surface form-footer">
      <div class="status-field">
        <label for="statusSel">Состояние</label>
        <select name="status" id="statusSel"></select>
      </div>
      <div class="actions">
        <button type="button" class="danger" id="deleteOrderBtn" style="display:none">Удалить</button>
        <button type="submit" class="primary">Сохранить</button>
      </div>
    </div>
    <input type="hidden" name="id" />
  </form>
</dialog>

<!-- Диалог настроек доски -->
<dialog id="boardDlg">
  <div class="dlg-head">
    <strong>Настройки доски</strong>
    <button class="ghost" onclick="closeBoard()">✖</button>
  </div>
  <form id="boardForm" class="dlg-body" method="dialog">
    <div class="rowc" style="flex-direction:column;align-items:stretch;gap:10px">
      <div><label>Название доски</label><input name="name" required /></div>
      <div><label>Схема статусов (по столбцам)</label><input name="lanes" placeholder="Не запланированное, Клиент, …, Отгружено" /></div>
    </div>
    <div class="rowc" style="justify-content:flex-end;gap:8px;margin-top:8px">
      <button type="button" class="danger" id="deleteBoardBtn">Удалить доску</button>
      <button type="submit" class="primary">Сохранить</button>
    </div>
    <input type="hidden" name="id" />
  </form>
</dialog>

<script>
const KEY='mini_crm_v13c';
const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>d.toISOString().slice(0,10);
const formatDateHuman=iso=>{if(!iso)return'';const d=new Date(iso);return Number.isNaN(d.getTime())?iso:d.toLocaleDateString('ru-RU');};
const applyStageDateHighlight=(input,orig,label)=>{if(!input)return;const original=(orig||'').trim();input.dataset.original=original;const current=input.value||'';if(original&&current&&original!==current){input.classList.add('crm-date-changed');input.title=`${label}: ${formatDateHuman(original)}`;}else{input.classList.remove('crm-date-changed');if(original){input.title=`${label}: ${formatDateHuman(original)}`;}else{input.removeAttribute('title');}}if(!original&&current){input.removeAttribute('title');}};
const iconPart=()=>'data:image/svg+xml;base64,'+btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><circle cx="32" cy="32" r="28" fill="#1b3b68"/><path d="M32 4a28 28 0 0 1 0 56z" fill="#4da3ff"/></svg>`);
const iconRest=()=>'data:image/svg+xml;base64,'+btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><circle cx="32" cy="32" r="28" fill="#15341e"/><path d="M32 4a28 28 0 0 0 0 56z" fill="#70e000"/></svg>`);

const DEFAULT_LANES=['Не запланированное','Клиент','Отдел продаж','Технологи','Производство','Закупка','Упаковка','Готово (Ож. отгрузки)','Отгружено'];
const DEFAULT_STAGES=['Подготовка в работу','Закупка','Рубка','Лазер','Гибка','Сварка','Мехобработка','Кооперация','Упаковка','Отгрузка'];
const defaultBoard=()=>({id:(crypto.randomUUID?.()||('crm-'+Math.random().toString(16).slice(2,10))),name:'Список заказов',lanes:[...DEFAULT_LANES],orders:[]});
const deepClone=value=>{
  if(typeof structuredClone==='function'){
    try{return structuredClone(value);}catch(_err){/* ignore */}
  }
  try{return JSON.parse(JSON.stringify(value));}
  catch(_err){
    if(!value||typeof value!=='object') return value;
    return Array.isArray(value) ? value.slice() : { ...value };
  }
};

let state=(window.__CRM_INITIAL_STATE__?deepClone(window.__CRM_INITIAL_STATE__):null)??load()??{boards:[defaultBoard()],currentBoardId:null};
if(!state.currentBoardId&&Array.isArray(state.boards)&&state.boards.length){state.currentBoardId=state.boards[0].id;}
persistLocal();
function load(){
  if(window.__CRM_INITIAL_STATE__){
    const initial=deepClone(window.__CRM_INITIAL_STATE__);
    window.__CRM_INITIAL_STATE__=null;
    return initial;
  }
  try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}
}
function persistLocal(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}
  catch(err){console.warn('CRM local save failed',err);}
}
function save(summary){persistLocal();queueSync(summary);}
function currentBoard(){return state.boards.find(b=>b.id===state.currentBoardId)}

const THEME_KEY='mini_crm_theme';
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);document.body.setAttribute('data-theme',t);localStorage.setItem(THEME_KEY,t);const btn=$('#themeBtn');if(btn) btn.textContent=t==='light'?'🌙':'☀️'}
applyTheme(localStorage.getItem(THEME_KEY)||'dark');
$('#themeBtn').onclick=()=>{const now=(document.documentElement.getAttribute('data-theme')==='light')?'dark':'light';applyTheme(now)};

function spanMuted(t){const s=document.createElement('span');s.className='muted';s.textContent=t;return s}
function chip(html,extra){const s=document.createElement('span');s.className='chip'+(extra?(' '+extra):'');s.innerHTML=html;return s}

const boardSelect=$('#boardSelect'),columns=$('#columns'),stats=$('#stats'),q=$('#q');
const LANE_PAGE_SIZE=10;
const laneVisibleCount=new Map();
let laneRegistryBoardId=null;
let dndInitialized=false;
let draggingId=null;

function ensureLaneRegistry(lanes,boardId){
  if(laneRegistryBoardId!==boardId){
    laneVisibleCount.clear();
    laneRegistryBoardId=boardId||null;
  }
  const snapshot=new Map();
  lanes.forEach(l=>{const existing=laneVisibleCount.get(l);snapshot.set(l,(existing&&existing>0)?existing:LANE_PAGE_SIZE);});
  laneVisibleCount.clear();
  snapshot.forEach((value,key)=>laneVisibleCount.set(key,value));
}

function increaseLaneLimit(lane){
  const current=laneVisibleCount.get(lane)||LANE_PAGE_SIZE;
  laneVisibleCount.set(lane,current+LANE_PAGE_SIZE);
  renderCards();
}

function laneLimit(lane){
  if(!laneVisibleCount.has(lane)) laneVisibleCount.set(lane,LANE_PAGE_SIZE);
  return laneVisibleCount.get(lane);
}

function renderBoardSelect(){boardSelect.innerHTML='';state.boards.forEach(b=>{const o=document.createElement('option');o.value=b.id;o.textContent=b.name;if(b.id===state.currentBoardId)o.selected=true;boardSelect.appendChild(o)})}
function renderColumns(){
  const b=currentBoard();
  columns.innerHTML='';
  if(!b){return;}
  ensureLaneRegistry(b.lanes,b.id);
  b.lanes.forEach(l=>{
    const c=document.createElement('div');
    c.className='col';
    const laneLabel=escapeHtml(l);
    c.innerHTML=`<header><h2>${laneLabel}</h2></header><div class="col-body"><div class="drop" data-lane="${laneLabel}"></div><div class="col-more hidden" data-lane="${laneLabel}" role="button" tabindex="0">Показать ещё 10 <span aria-hidden="true">↓</span></div></div>`;
    columns.appendChild(c);
    const drop=c.querySelector('.drop');
    const more=c.querySelector('.col-more');
    if(drop) drop.dataset.lane=l;
    if(more) more.dataset.lane=l;
  });
  $$('.col-more',columns).forEach(btn=>{
    const lane=btn.dataset.lane;
    if(!lane)return;
    btn.addEventListener('click',()=>increaseLaneLimit(lane));
    btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();increaseLaneLimit(lane);}});
  });
  enableDnd();
}

function computeOrderDatesFromStages(o){const st=o.stages||[];const sd=st.map(x=>x.start).filter(Boolean).sort();const ed=st.map(x=>x.end).filter(Boolean).sort();o.start=sd[0]||'';o.end=ed[ed.length-1]||''}
function stagesDoneCount(o){const s=o.stages||[];const d=s.filter(x=>x.done||Number(x.progress||0)>=100).length;return[d,s.length]}

function renderCards(){
  const b=currentBoard();
  if(!b)return;
  const qv=q.value.trim().toLowerCase(); const map=Object.fromEntries(b.lanes.map(l=>[l,[]]));
  b.orders.forEach(o=>{
    computeOrderDatesFromStages(o);
    const inSearch=!qv||(o.title.toLowerCase().includes(qv)||(o.orderNo||'').toLowerCase().includes(qv)||(o.customer||'').toLowerCase().includes(qv)||(o.stages||[]).some(s=>s.name.toLowerCase().includes(qv)));
    if(!inSearch)return; const lane=map[o.status]?o.status:b.lanes[0]; map[lane].push(o);
  });

  Object.entries(map).forEach(([lane,arr])=>{
    const drop=$(`.drop[data-lane="${CSS.escape(lane)}"]`,columns);
    if(!drop)return;
    const moreBtn=$(`.col-more[data-lane="${CSS.escape(lane)}"]`,columns);
    const prevScroll=drop.scrollTop;
    drop.innerHTML='';
    const limit=laneLimit(lane);
    const visible=arr.slice(0,limit);
    if(!visible.length){
      const p=document.createElement('div');p.className='empty';p.textContent='Пусто';drop.appendChild(p);
    }
    visible.forEach(o=>{
      const card=document.createElement('div');card.className='card';card.draggable=true;card.dataset.id=o.id;
      const progress=calcAutoProgress(o.stages); const [doneCnt,totalCnt]=stagesDoneCount(o);
      const chips=document.createElement('div');chips.className='chips';
      (o.stages||[]).forEach(st=>{if(st.value!==''&&st.value!==undefined&&st.value!==null){chips.appendChild(chip(`${escapeHtml(st.name)}: ${escapeHtml(st.value)}`))}});
      if(o.partOfPct)chips.appendChild(chip(`<img src="${iconPart()}"/>Часть (${o.partOfPct}%)`,'ok'));
      if(o.restOfPct)chips.appendChild(chip(`<img src="${iconRest()}"/>Остаток (${o.restOfPct}%)`,'warn'));
      if(o.serviceTotal!==''&&o.serviceTotal!=null)chips.appendChild(chip(`Сумма услуг: ${Number(o.serviceTotal).toLocaleString('ru-RU')} ₽`));
      if(o.start||o.end){const sd=o.start||'—';const ed=o.end||'—';chips.appendChild(chip(`${sd} — ${ed}`,'warn'))}
      const readyChecked=o.done?'checked':'';
      card.innerHTML=`
        <div class="row">
          <div class="title">
            <input type="checkbox" class="ready-switch card-ready" data-act="toggle-done" ${readyChecked} title="Отметить заказ готовым" />
            ${escapeHtml(o.title)}
          </div>
          <div class="kebab grow"></div>
          <button class="ghost" data-act="move" title="Переместить ↩">↩</button>
          <button class="ghost" data-act="edit" title="Открыть">✏️</button>
        </div>
        <div class="sub">№ ${escapeHtml(o.orderNo||'—')} · ${escapeHtml(o.customer||'Без клиента')}</div>`;
      card.appendChild(chips);

function computeDropReference(container,clientY){
  const cards=Array.from(container.querySelectorAll('.card:not(.dragging)'));
  for(const card of cards){
    const rect=card.getBoundingClientRect();
    if(clientY<rect.top+rect.height/2){
      return card.dataset.id||null;
    }
  }
  return null;
}

function moveOrderToLane(orderId,targetLane,beforeId){
  const b=currentBoard();
  if(!b)return false;
  const list=b.orders;
  const fromIndex=list.findIndex(o=>o.id===orderId);
  if(fromIndex===-1)return false;
  const order=list[fromIndex];
  const originalLane=order.status;
  const originalLaneIndex=list.slice(0,fromIndex).filter(x=>x.status===originalLane).length;
  list.splice(fromIndex,1);
  order.status=targetLane;
  let insertIndex=list.length;
  if(beforeId){
    const idx=list.findIndex(o=>o.id===beforeId);
    if(idx>=0){
      insertIndex=idx;
    }else{
      beforeId=null;
    }
  }
  if(!beforeId){
    insertIndex=list.length;
    for(let i=list.length-1;i>=0;i--){
      if(list[i].status===targetLane){
        insertIndex=i+1;
        break;
      }
    }
  }
  list.splice(insertIndex,0,order);
  let finalLaneIndex=0;
  let seen=0;
  for(const item of list){
    if(item.status===targetLane){
      if(item.id===orderId){
        finalLaneIndex=seen;
        break;
      }
      seen++;
    }
  }
  const changed=originalLane!==targetLane||originalLaneIndex!==finalLaneIndex;
  return changed;
}

function parseDateInputValue(value){
  if(!value) return null;
  const trimmed=String(value).trim();
  if(!trimmed) return null;
  const d=new Date(`${trimmed}T00:00:00`);
  if(Number.isNaN(d.getTime())) return null;
  d.setHours(0,0,0,0);
  return d;
}

function crmExpectedReferenceDate(){
  const ref=new Date();
  ref.setHours(0,0,0,0);
  ref.setDate(ref.getDate()-1);
  ref.setHours(23,59,59,999);
  return ref;
}

function computeExpectedPercentForInputs(startValue,endValue){
  const start=parseDateInputValue(startValue);
  const end=parseDateInputValue(endValue);
  if(!start||!end) return null;
  const startMs=start.getTime();
  const endCopy=new Date(end);
  endCopy.setHours(23,59,59,999);
  const endMs=endCopy.getTime();
  if(endMs<=startMs){
    return crmExpectedReferenceDate().getTime()<startMs?0:100;
  }
  const ref=crmExpectedReferenceDate();
  const refMs=ref.getTime();
  if(refMs<=startMs) return 0;
  if(refMs>=endMs) return 100;
  const fraction=(refMs-startMs)/(endMs-startMs);
  return Math.max(0,Math.min(100,fraction*100));
}

function updateStageRowExpectation(tr){
  if(!tr) return;
  const indicator=tr.querySelector('.expected-indicator');
  if(!indicator){return;}
  const progressEl=tr.querySelector('[data-k="progress"]');
  if(!progressEl){indicator.textContent='';indicator.classList.remove('behind');return;}
  const startInput=tr.querySelector('[data-k="start"]');
  const endInput=tr.querySelector('[data-k="end"]');
  const expected=computeExpectedPercentForInputs(startInput?.value||'',endInput?.value||'');
  if(expected==null){
    indicator.textContent='';
    indicator.classList.remove('behind');
    return;
  }
  const rounded=Math.round(expected);
  indicator.textContent=`/${rounded}%`;
  const actual=Math.max(0,Math.min(100,Number(progressEl.value||0)));
  indicator.classList.toggle('behind',actual<rounded);
}

  child.stages=(parent.stages||[]).map(st=>{const init=Number(parent._origValues?.[st.name]??st.value??0);const curr=Number(st.value??0);const share=hasAnyStageShare?(stageShares[st.name]??0):basePct; if(!Number.isFinite(init)||init<=0)return {...st}; let childWant=round(init*(share/100)); childWant=Math.min(childWant,curr); return {...st,value:childWant}});
  parent.stages=(parent.stages||[]).map(st=>{const init=Number(parent._origValues?.[st.name]??st.value??0);const curr=Number(st.value??0);const share=hasAnyStageShare?(stageShares[st.name]??0):basePct; if(!Number.isFinite(init)||init<=0)return {...st}; let childWant=round(init*(share/100)); childWant=Math.min(childWant,curr); const parentVal=round(curr-childWant); return {...st,value:parentVal}});

  if(!hasAnyStageShare){const allowed=Math.max(0,100-parent._origPctUsed);const used=Math.min(allowed,basePct);child.partOfPct=used;parent._origPctUsed+=used;parent.restOfPct=Math.max(0,100-parent._origPctUsed);if(parent.restOfPct===0)parent.restOfPct=null}else{child.partOfPct=null;parent.restOfPct=null}

  computeOrderDatesFromStages(child); computeOrderDatesFromStages(parent); child.progress=calcAutoProgress(child.stages); parent.progress=calcAutoProgress(parent.stages);
  b.orders.push(child); save('Создание подзаказа'); renderCards(); splitDlg.close(); alert('Подзаказ создан и значения распределены.');
});
function round(n){return Math.round((n+Number.EPSILON)*100)/100}

    const order={id,title:names[i],orderNo:`24-${100+i}`,customer:['ООО Ромашка','ЗАО Лист','ИП Металл'][i%3],

/* === CRM ↔ Planner Sync === */
const CRM_ALIAS_STORAGE_KEY='mini_crm_user_alias_v1';
const toastLayer=document.getElementById('toastLayer');
function positionToastLayer(){
  if(!toastLayer) return;
  let offset=20;
  const header=document.querySelector('header');
  if(header){
    const rect=header.getBoundingClientRect();
    if(rect && !Number.isNaN(rect.bottom)){
      offset=Math.max(20, rect.bottom + 16);
    }
  }
  toastLayer.style.top=`${offset}px`;
}
positionToastLayer();
window.addEventListener('resize', positionToastLayer);
let crmNotificationsMuted=window.__CRM_NOTIFICATIONS_MUTED__===true;
function derivePlannerNotificationsMuted(state){
  if(!state||typeof state!=='object') return undefined;
  if(typeof state.notificationsMuted==='boolean') return state.notificationsMuted;
  const meta=state.meta||{};
  if(typeof meta.notificationsMuted==='boolean') return meta.notificationsMuted;
  if(meta.settings&&typeof meta.settings.notificationsMuted==='boolean') return meta.settings.notificationsMuted;
  if(state.settings&&typeof state.settings.notificationsMuted==='boolean') return state.settings.notificationsMuted;
  return undefined;
}
function syncCrmNotificationsMutedFromPlanner(state){
  const next=derivePlannerNotificationsMuted(state);
  if(typeof next==='boolean'){
    crmNotificationsMuted=next;
    window.__CRM_NOTIFICATIONS_MUTED__=next;
  }
}
let crmSyncTimer=null;
let crmPendingSummary='Изменения CRM';
let crmSuppressNext=false;
let crmSyncInFlight=false;
let crmAlias=(()=>{
  try{const stored=localStorage.getItem(CRM_ALIAS_STORAGE_KEY); if(stored) return stored;}
  catch(_err){/* ignore */}
  return 'CRM оператор';
})();

function setCrmAlias(name){
  crmAlias=(name||'CRM оператор').trim()||'CRM оператор';
  try{localStorage.setItem(CRM_ALIAS_STORAGE_KEY,crmAlias);}catch(_err){/* ignore */}
}

function showToast({title='CRM',message='',tone='info',autoClose=3200}={}){
  if(crmNotificationsMuted) return;
  if(!toastLayer) return;
  positionToastLayer();
  const toast=document.createElement('div');
  toast.className=`toast ${tone==='success'?'success':tone==='warn'?'warn':tone==='error'?'error':''}`.trim();
  toast.innerHTML=`<strong>${escapeHtml(title)}</strong><span>${escapeHtml(message)}</span>`;
  toastLayer.appendChild(toast);
  const close=()=>{toast.remove();};
  toast.addEventListener('click',close,{once:true});
  if(autoClose>0){setTimeout(close,autoClose);}
}

function queueSync(summary){
  crmPendingSummary=summary||'Изменения CRM';
  if(crmSyncTimer) clearTimeout(crmSyncTimer);
  crmSyncTimer=setTimeout(pushCrmToServer,450);
}

function buildCrmOrdersSummary(snapshot){
  if(!snapshot||typeof snapshot!=='object'||!Array.isArray(snapshot.boards)||!snapshot.boards.length) return null;
  const active=snapshot.boards.find(b=>b.id===snapshot.currentBoardId) || snapshot.boards[0];
  if(!active) return null;
  const totals={orders:Array.isArray(active.orders)?active.orders.length:0,lanes:{}};
  (active.lanes||[]).forEach(lane=>{totals.lanes[lane]=0;});
  (active.orders||[]).forEach(order=>{
    const lane=(order?.status&&Object.prototype.hasOwnProperty.call(totals.lanes,order.status))?order.status:(active.lanes?.[0]||'');
    if(lane && Object.prototype.hasOwnProperty.call(totals.lanes,lane)) totals.lanes[lane]+=1;
  });
  const sample=(active.orders||[]).slice(0,10).map(order=>({
    orderId:order.orderNo||order.id||'',
    title:order.title||'',
    customer:order.customer||'',
    lane:order.status||active.lanes?.[0]||'',
    done:!!order.done,
    total:order.serviceTotal??''
  }));
  return { stages:['crm'], totals, orders:sample };
}

async function pushCrmToServer(){
  if(crmSyncInFlight) return;
  crmSyncTimer=null;
  crmSyncInFlight=true;
  if(!window.plannerRemote||typeof window.plannerRemote.saveState!=='function'){
    crmSyncInFlight=false;
    return;
  }
  const snapshot=deepClone(state);
  if(!snapshot){
    crmSyncInFlight=false;
    return;
  }
  const summaryText = crmPendingSummary || 'Изменения CRM';

  const buildPlannerSyncPayload = async () => {
    let plannerSnapshot=null;
    let baseEtag=null;
    let baseHash=null;
    try{
      const loaded=await window.plannerRemote.loadState({ withMeta:true });
      let raw=loaded;
      if(loaded && typeof loaded==='object' && typeof loaded.state==='string'){
        raw=loaded.state;
        if(loaded.etag) baseEtag=String(loaded.etag).trim()||null;
        if(loaded.hash) baseHash=String(loaded.hash).trim()||null;
      }
      plannerSnapshot=raw?JSON.parse(raw):{};
    }catch(err){
      const loadError=new Error('CRM planner state load failed');
      loadError.code='CRM_PLANNER_LOAD_FAILED';
      loadError.originalError=err;
      throw loadError;
    }
    if(!plannerSnapshot||typeof plannerSnapshot!=='object') plannerSnapshot={};
    syncCrmNotificationsMutedFromPlanner(plannerSnapshot);
    plannerSnapshot.crm=snapshot;
    const nowIso=new Date().toISOString();
    plannerSnapshot.crm.updatedAt=nowIso;
    const now=new Date(nowIso);
    const nowLabel=now.toLocaleString();
    const meta=plannerSnapshot.meta || (plannerSnapshot.meta={});
    const versions=meta.versions || (meta.versions={});
    versions.crm=(Number(versions.crm)||0)+1;
    meta.lastAuthors=meta.lastAuthors || {};
    meta.lastAuthors.crm={ name:crmAlias, at:nowIso };
    const summaryObj=buildCrmOrdersSummary(snapshot);
    meta.lastChange={
      stage:'crm',
      stages:['crm'],
      summary:summaryText,
      user:crmAlias,
      source:'crm',
      time:nowLabel,
      changeType:'CRM',
      ordersSummary:summaryObj
    };
    meta.ordersSummary=summaryObj;
    const history=Array.isArray(meta.history)?meta.history.slice(-199):[];
    history.push({
      id:`crm-${Date.now()}-${Math.random().toString(16).slice(2,8)}`,
      stage:'crm',
      user:crmAlias,
      summary:summaryText,
      source:'crm',
      time:nowLabel,
      changeType:'CRM',
      ordersSummary:summaryObj
    });
    meta.history=history;

    const metaPayload={
      stage:'crm',
      source:'crm',
      summary:summaryText,
      user:crmAlias,
      time:nowLabel,
      changeType:'CRM',
      ordersSummary:summaryObj
    };
    if(baseHash) metaPayload.baseHash=baseHash;
    if(baseEtag) metaPayload.baseEtag=baseEtag;
    if(!metaPayload.ifMatch){
      if(baseEtag) metaPayload.ifMatch=baseEtag;
      else if(baseHash) metaPayload.ifMatch=`W/"${baseHash}"`;
    }
    return {
      stateString:JSON.stringify(plannerSnapshot),
      metaPayload
    };
  };

  let attempt=0;
  let success=false;
  let lastError=null;
  while(attempt<2 && !success){
    attempt+=1;
    let payload;
    try{
      payload=await buildPlannerSyncPayload();
    }catch(err){
      lastError=err;
      break;
    }
    try{
      crmSuppressNext=true;
      await window.plannerRemote.saveState(payload.stateString,payload.metaPayload);
      success=true;
    }catch(err){
      crmSuppressNext=false;
      lastError=err;
      if(err && err.name==='PlannerConflictError' && attempt<2){
        continue;
      }
      break;
    }
  }

  if(success){
    showToast({title:'CRM',message:'Изменения синхронизированы',tone:'success'});
  }else if(lastError){
    crmSuppressNext=false;
    if(lastError.code==='CRM_PLANNER_LOAD_FAILED'){
      console.error('CRM: load planner state failed',lastError.originalError||lastError);
      showToast({title:'CRM',message:'Не удалось получить данные планировщика',tone:'error'});
    }else{
      console.error('CRM sync failed',lastError);
      const detail=(lastError?.detail&&typeof lastError.detail==='object')? (lastError.detail.message||lastError.detail.error||'') : '';
      let message=detail || lastError?.message || 'Не удалось синхронизировать изменения';
      if(lastError && lastError.name==='PlannerConflictError'){
        message='Данные планировщика изменились. Обновите список и повторите попытку.';
      }
      showToast({title:'CRM',message,tone:'error',autoClose:5000});
    }
  }

  crmSyncInFlight=false;
}

function applyRemoteCrm(crm){
  if(!crm||typeof crm!=='object') return;
  const cloned=deepClone(crm) || { boards:[defaultBoard()], currentBoardId:null };
  if(!Array.isArray(cloned.boards) || !cloned.boards.length){
    cloned.boards=[defaultBoard()];
  }
  if(!cloned.currentBoardId || !cloned.boards.some(b=>b.id===cloned.currentBoardId)){
    cloned.currentBoardId=cloned.boards[0].id;
  }
  state=cloned;
  persistLocal();
  renderAll();
}

if(window.plannerRemote&&typeof window.plannerRemote.onRemoteUpdate==='function'){
  window.plannerRemote.onRemoteUpdate(payload=>{
    if(crmSuppressNext){ crmSuppressNext=false; return; }
    if(!payload||!payload.state) return;
    try{
      const parsed=JSON.parse(payload.state);
      syncCrmNotificationsMutedFromPlanner(parsed);
      if(parsed&&parsed.crm){
        applyRemoteCrm(parsed.crm);
        showToast({title:'CRM',message:'Данные обновлены из планировщика',tone:'warn'});
      }
    }catch(err){ console.warn('CRM remote update parse failed',err); }
  });
}

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden' && crmSyncTimer){
    pushCrmToServer();
  }
});
window.addEventListener('beforeunload',()=>{
  if(crmSyncTimer){
    pushCrmToServer();
  }
});
