<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Планировщик · Единая система</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <header>
    <div class="top-bar">
      <h1>Планировщик</h1>
      <nav>
        <a href="/planner.html" data-nav="planner">Планировщик</a>
        <a href="/crm.html" data-nav="crm">CRM</a>
      </nav>
      <div class="spacer"></div>
      <span class="user-chip" id="user-chip"></span>
      <button class="btn secondary" id="logout">Выход</button>
    </div>
    <div class="settings-bar">
      <div class="setting">
        Источник данных:
        <select id="data-source">
          <option value="csv">CSV</option>
          <option value="crm">CRM</option>
        </select>
      </div>
      <div class="setting">
        Скорость синхронизации:
        <select id="sync-speed">
          <option value="fast">Быстро</option>
          <option value="standard">Стандарт</option>
          <option value="calm">Спокойно</option>
        </select>
      </div>
      <div class="setting">
        <span class="badge success">Автооптимизация включена</span>
      </div>
    </div>
  </header>
  <main>
    <section id="status-bar">
      <span class="offline-indicator hidden" id="offline-indicator">🟡 Оффлайн</span>
      <span id="last-updated"></span>
    </section>
    <section class="card-grid" id="orders-container"></section>
  </main>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      App.markNavActive('planner');
      try {
        const user = await App.fetchCurrentUser();
        if (!user) {
          window.location.href = '/';
          return;
        }
        document.getElementById('user-chip').textContent = `${user.displayName || user.email} · ${user.role}`;
      } catch (err) {
        window.location.href = '/';
        return;
      }

      const dataSourceSelect = document.getElementById('data-source');
      const syncSpeedSelect = document.getElementById('sync-speed');
      const ordersContainer = document.getElementById('orders-container');
      const offlineIndicator = document.getElementById('offline-indicator');
      const lastUpdatedEl = document.getElementById('last-updated');
      const logoutBtn = document.getElementById('logout');

      const localDataSource = App.readPreference('planner.dataSource');
      const localSyncSpeed = App.readPreference('planner.syncSpeed');

      const me = App.getCurrentUserSync();
      const serverSettings = me?.settings || {};

      let dataSource = App.normalizeDataSource(localDataSource || serverSettings.dataSource || 'csv');
      let syncSpeed = App.normalizeSyncSpeed(localSyncSpeed || serverSettings.syncSpeed || 'standard');

      dataSourceSelect.value = dataSource;
      syncSpeedSelect.value = syncSpeed;

      let crmState = null;
      let csvState = null;
      let crmReloadQueued = false;

      async function persistPreferences(partial) {
        try {
          await App.apiFetch('/api/me/preferences', {
            method: 'PUT',
            body: {
              dataSource,
              syncSpeed,
              ...partial
            }
          });
        } catch (err) {
          App.showToast('Не удалось сохранить настройки', 'warning');
        }
      }

      async function loadCrmState() {
        crmReloadQueued = false;
        try {
          crmState = await App.apiFetch('/api/crm/state');
          render();
        } catch (err) {
          App.showToast('Не удалось загрузить данные CRM', 'error');
        }
      }

      async function loadCsvState() {
        try {
          csvState = await App.apiFetch('/api/state');
          render();
        } catch (err) {
          App.showToast('Не удалось загрузить CSV состояние', 'error');
        }
      }

      function scheduleCrmReload() {
        if (crmReloadQueued) {
          return;
        }
        crmReloadQueued = true;
        setTimeout(() => {
          if (dataSource === 'crm') {
            loadCrmState();
          } else {
            crmReloadQueued = false;
          }
        }, syncSpeed === 'fast' ? 300 : syncSpeed === 'standard' ? 800 : 1500);
      }

      function renderCrm() {
        if (!crmState) {
          ordersContainer.innerHTML = '<div class="surface">Данные CRM не загружены.</div>';
          return;
        }
        if (!Array.isArray(crmState.orders) || crmState.orders.length === 0) {
          ordersContainer.innerHTML = '<div class="surface">Нет заказов в CRM.</div>';
          return;
        }
        ordersContainer.innerHTML = '';
        crmState.orders.forEach((order) => {
          const card = document.createElement('article');
          card.className = 'order-card card-draggable';
          card.dataset.orderId = order.id;

          const header = document.createElement('header');
          const titleBox = document.createElement('div');
          const orderTitle = document.createElement('h3');
          orderTitle.textContent = `${order.orderNo}`;
          const subtitle = document.createElement('p');
          subtitle.textContent = order.title || 'Без названия';
          titleBox.appendChild(orderTitle);
          titleBox.appendChild(subtitle);

          const badges = document.createElement('div');
          badges.className = 'order-meta';
          badges.innerHTML = `
            <span class="badge">${order.lane}</span>
            <span class="badge">${order.stages.length} переделов</span>
            <span class="badge">${App.formatCurrency(order.serviceTotal)}</span>
          `;

          header.appendChild(titleBox);
          header.appendChild(badges);
          card.appendChild(header);

          const info = document.createElement('div');
          info.className = 'order-meta';
          info.innerHTML = `
            <span>Клиент: <strong>${order.customer || '—'}</strong></span>
            <span>Готовность: <strong>${order.isDone ? 'Выполнено' : 'В работе'}</strong></span>
            <span>Изменено: <strong>${App.formatDateTime(order.updatedAt)}</strong></span>
          `;
          card.appendChild(info);

          if (order.stages.length > 0) {
            const table = document.createElement('table');
            table.className = 'stage-table';
            table.innerHTML = `
              <thead>
                <tr>
                  <th>Передел</th>
                  <th>Начало</th>
                  <th>Конец</th>
                  <th>%</th>
                  <th>Готово</th>
                  <th></th>
                </tr>
              </thead>
              <tbody></tbody>
            `;
            const tbody = table.querySelector('tbody');
            order.stages.forEach((stage) => {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td>${stage.stageName}</td>
                <td><input type="date" class="stage-date-start" value="${stage.dateStart || ''}" /></td>
                <td><input type="date" class="stage-date-end" value="${stage.dateEnd || ''}" /></td>
                <td><input type="number" min="0" max="100" class="stage-percent" value="${stage.percent ?? ''}" /></td>
                <td><label class="checkbox-inline"><input type="checkbox" class="stage-ready" ${stage.isReady ? 'checked' : ''} />Готово</label></td>
                <td><button class="btn secondary stage-save" type="button">Сохранить</button></td>
              `;
              tr.querySelector('.stage-save').addEventListener('click', async () => {
                const payload = {
                  id: stage.id,
                  orderId: order.id,
                  dateStart: tr.querySelector('.stage-date-start').value || null,
                  dateEnd: tr.querySelector('.stage-date-end').value || null,
                  percent: tr.querySelector('.stage-percent').value ? Number(tr.querySelector('.stage-percent').value) : null,
                  isReady: tr.querySelector('.stage-ready').checked
                };
                try {
                  await App.apiFetch('/api/crm/stages', { method: 'PUT', body: payload });
                  App.showToast('Передел обновлён', 'success');
                  scheduleCrmReload();
                } catch (err) {
                  App.showToast('Не удалось обновить передел', 'error');
                }
              });
              tbody.appendChild(tr);
            });
            card.appendChild(table);
          }

          const actions = document.createElement('div');
          actions.className = 'stage-actions';
          actions.innerHTML = `
            <label class="checkbox-inline">
              <input type="checkbox" class="order-ready" ${order.isDone ? 'checked' : ''} /> Готово
            </label>
            <select class="order-lane"></select>
            <button type="button" class="btn secondary order-save">Обновить</button>
          `;
          const laneSelect = actions.querySelector('.order-lane');
          (crmState.lanes || []).forEach((lane) => {
            const option = document.createElement('option');
            option.value = lane;
            option.textContent = lane;
            if (lane === order.lane) {
              option.selected = true;
            }
            laneSelect.appendChild(option);
          });
          actions.querySelector('.order-save').addEventListener('click', async () => {
            try {
              await App.apiFetch('/api/crm/orders', {
                method: 'PUT',
                body: {
                  id: order.id,
                  orderNo: order.orderNo,
                  title: order.title,
                  lane: laneSelect.value,
                  customer: order.customer,
                  serviceTotal: order.serviceTotal,
                  isDone: actions.querySelector('.order-ready').checked,
                  parentOrderId: order.parentOrderId
                }
              });
              App.showToast('Заказ обновлён', 'success');
              scheduleCrmReload();
            } catch (err) {
              if (err.status === 403) {
                App.showToast('Недостаточно прав для изменения заказа', 'warning');
              } else {
                App.showToast('Не удалось обновить заказ', 'error');
              }
            }
          });
          card.appendChild(actions);
          ordersContainer.appendChild(card);
        });

        lastUpdatedEl.textContent = `CRM обновлена: ${App.formatDateTime(crmState.updatedAt)}`;
      }

      function renderCsv() {
        if (!csvState) {
          ordersContainer.innerHTML = '<div class="surface">Нет данных CSV для отображения.</div>';
          return;
        }
        const orders = Array.isArray(csvState.orders) ? csvState.orders : [];
        if (orders.length === 0) {
          ordersContainer.innerHTML = '<div class="surface">CSV доска пока пустая.</div>';
          return;
        }
        ordersContainer.innerHTML = '';
        orders.forEach((order) => {
          const card = document.createElement('article');
          card.className = 'order-card';
          const name = order.orderNo || order.order || order.title || order.name || 'Без названия';
          const header = document.createElement('header');
          const box = document.createElement('div');
          const h3 = document.createElement('h3');
          h3.textContent = name;
          box.appendChild(h3);
          if (order.customer || order.client) {
            const p = document.createElement('p');
            p.textContent = order.customer || order.client;
            box.appendChild(p);
          }
          header.appendChild(box);
          card.appendChild(header);
          const list = document.createElement('div');
          list.className = 'order-meta';
          list.innerHTML = `
            <span>Колонка: <strong>${order.state || order.lane || '—'}</strong></span>
            <span>Подзадач: <strong>${Array.isArray(order.items) ? order.items.length : (order.tasks ? order.tasks.length : (order.children ? order.children.length : 0))}</strong></span>
          `;
          card.appendChild(list);
          ordersContainer.appendChild(card);
        });
        lastUpdatedEl.textContent = 'CSV состояние загружено';
      }

      function render() {
        if (dataSource === 'crm') {
          renderCrm();
        } else {
          renderCsv();
        }
      }

      dataSourceSelect.addEventListener('change', async () => {
        dataSource = App.normalizeDataSource(dataSourceSelect.value);
        App.storePreference('planner.dataSource', dataSource);
        await persistPreferences({ dataSource });
        App.showToast(`Источник данных: ${dataSource.toUpperCase()}`, 'info');
        if (dataSource === 'crm') {
          loadCrmState();
        } else {
          loadCsvState();
        }
      });

      syncSpeedSelect.addEventListener('change', async () => {
        syncSpeed = App.normalizeSyncSpeed(syncSpeedSelect.value);
        App.storePreference('planner.syncSpeed', syncSpeed);
        await persistPreferences({ syncSpeed });
        App.showToast('Скорость синхронизации обновлена', 'info');
      });

      logoutBtn.addEventListener('click', () => {
        App.logout();
      });

      const connection = App.connectSse((event) => {
        if (event.entity === 'planner' && event.type === 'state-updated' && event.changed?.mode === 'csv') {
          try {
            csvState = typeof event.changed.state === 'string' ? JSON.parse(event.changed.state) : event.changed.state;
            if (dataSource === 'csv') {
              renderCsv();
            }
          } catch (err) {
            console.warn('Failed to parse csv snapshot', err);
          }
        }
        if (event.changed?.mode === 'crm') {
          if (event.changed.state) {
            crmState = event.changed.state;
            if (dataSource === 'crm') {
              renderCrm();
            }
          } else {
            scheduleCrmReload();
          }
        }
        if (event.type === 'bulk' && event.changed?.mode === 'crm') {
          scheduleCrmReload();
        }
        if (event.entity === 'order' || event.entity === 'stage') {
          scheduleCrmReload();
        }
      }, (status) => {
        offlineIndicator.classList.toggle('hidden', status !== 'offline' && status !== 'retrying');
      });

      window.addEventListener('beforeunload', () => connection.close());

      if (dataSource === 'crm') {
        loadCrmState();
      } else {
        loadCsvState();
      }
    });
  </script>
</body>
</html>
