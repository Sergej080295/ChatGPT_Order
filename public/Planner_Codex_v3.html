<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>PlanCore — Планировщик</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7fb;
        --panel: #ffffff;
        --border: #d9dce5;
        --text: #1e2432;
        --accent: #3366ff;
        --accent-muted: rgba(51, 102, 255, 0.1);
        --done: #2f9d5d;
        --late: #d64545;
        --gantt-bg: #eef1f8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 1.5rem 2rem 1rem;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 2px 12px rgba(30, 36, 50, 0.08);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      header h1 {
        margin: 0 0 0.75rem 0;
        font-size: 1.75rem;
        font-weight: 700;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
      }

      .stages {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .stage-btn {
        border: 1px solid var(--border);
        background: var(--panel);
        color: inherit;
        padding: 0.45rem 0.85rem;
        border-radius: 999px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.15s ease;
      }

      .stage-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .stage-btn.active {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
        box-shadow: 0 4px 12px rgba(51, 102, 255, 0.35);
      }

      .filter {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-left: auto;
        font-size: 0.9rem;
      }

      .filter select {
        padding: 0.4rem 0.6rem;
        border-radius: 0.65rem;
        border: 1px solid var(--border);
        background: var(--panel);
        font-size: 0.9rem;
      }

      main {
        flex: 1;
        padding: 1.5rem 2rem 3rem;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1.5rem;
      }

      section {
        background: var(--panel);
        border-radius: 1.25rem;
        padding: 1.5rem;
        box-shadow: 0 12px 32px rgba(30, 36, 50, 0.08);
        border: 1px solid rgba(30, 36, 50, 0.05);
      }

      section h2 {
        margin-top: 0;
        margin-bottom: 1rem;
        font-size: 1.3rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
      }

      th,
      td {
        padding: 0.65rem 0.5rem;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: middle;
      }

      th {
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: rgba(30, 36, 50, 0.7);
      }

      tr:last-child td {
        border-bottom: none;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 0.1rem 0.6rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        background: var(--accent-muted);
        color: var(--accent);
      }

      .badge.done {
        background: rgba(47, 157, 93, 0.15);
        color: var(--done);
      }

      .badge.late {
        background: rgba(214, 69, 69, 0.15);
        color: var(--late);
      }

      .gantt-grid {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        background: var(--gantt-bg);
        padding: 1rem;
        border-radius: 0.9rem;
        border: 1px solid rgba(30, 36, 50, 0.05);
        overflow-x: auto;
      }

      .gantt-row {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .gantt-label {
        width: 140px;
        font-weight: 600;
        font-size: 0.9rem;
        flex-shrink: 0;
      }

      .gantt-bar-track {
        flex: 1;
        height: 14px;
        background: rgba(51, 102, 255, 0.12);
        border-radius: 999px;
        position: relative;
      }

      .gantt-bar {
        position: absolute;
        height: 100%;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 1px rgba(51, 102, 255, 0.35);
      }

      .gantt-bar.done {
        background: var(--done);
        box-shadow: 0 0 0 1px rgba(47, 157, 93, 0.35);
      }

      .gantt-bar.late {
        background: var(--late);
        box-shadow: 0 0 0 1px rgba(214, 69, 69, 0.35);
      }

      .routes {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .route-card {
        border: 1px solid rgba(30, 36, 50, 0.08);
        border-radius: 0.9rem;
        padding: 1rem;
        background: rgba(30, 36, 50, 0.02);
      }

      .route-card h3 {
        margin: 0 0 0.75rem 0;
        font-size: 1.05rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .route-card h3 span {
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: rgba(30, 36, 50, 0.6);
      }

      .route-stages {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 0.5rem;
      }

      .route-stage {
        border-radius: 0.75rem;
        padding: 0.5rem 0.6rem;
        background: #fff;
        border: 1px solid rgba(30, 36, 50, 0.08);
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        min-height: 72px;
      }

      .route-stage strong {
        font-size: 0.85rem;
        font-weight: 600;
      }

      .route-stage span {
        font-size: 0.75rem;
        color: rgba(30, 36, 50, 0.65);
      }

      .empty {
        padding: 2rem;
        text-align: center;
        color: rgba(30, 36, 50, 0.55);
        font-size: 0.95rem;
        border: 1px dashed rgba(30, 36, 50, 0.15);
        border-radius: 0.9rem;
        background: rgba(30, 36, 50, 0.02);
      }

      .orders-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.75rem;
        color: rgba(30, 36, 50, 0.65);
        font-size: 0.85rem;
      }

      .timestamp {
        font-variant-numeric: tabular-nums;
      }

      @media (max-width: 960px) {
        header {
          padding: 1.25rem;
        }
        main {
          padding: 1.25rem;
        }
        .filter {
          width: 100%;
          justify-content: flex-start;
          margin-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PlanCore — Планировщик</h1>
      <div class="toolbar">
        <div class="stages" id="stages"></div>
        <label class="filter">
          <span>Фильтр заказов:</span>
          <select id="order-filter">
            <option value="current">Текущие</option>
            <option value="all">Все заказы</option>
            <option value="done">Готовые</option>
            <option value="late">С опозданием</option>
          </select>
        </label>
      </div>
    </header>
    <main>
      <section>
        <div class="orders-meta">
          <h2 id="stage-title">Загрузка…</h2>
          <div id="last-update" class="timestamp"></div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Заказ</th>
                <th>Статус</th>
                <th>Плановые сроки</th>
                <th>Факт</th>
                <th>Прогресс</th>
              </tr>
            </thead>
            <tbody id="orders-body"></tbody>
          </table>
          <div id="orders-empty" class="empty" hidden>
            Нет заказов, удовлетворяющих выбранному фильтру.
          </div>
        </div>
      </section>

      <section>
        <h2>Диаграмма Ганта</h2>
        <div id="gantt" class="gantt-grid"></div>
        <div id="gantt-empty" class="empty" hidden>
          Недостаточно данных по датам, чтобы построить диаграмму.
        </div>
      </section>

      <section>
        <h2>Общий маршрут заказов</h2>
        <div id="routes" class="routes"></div>
        <div id="routes-empty" class="empty" hidden>
          Маршруты заказов пока не сформированы.
        </div>
      </section>
    </main>

    <script>
      const state = {
        processes: [],
        orders: new Map(),
        stageOrders: new Map(),
        orderProcessesById: new Map(),
        orderProcessesByOrder: new Map(),
        selectedStage: null,
        filter: 'current',
        lastUpdate: null,
        eventSource: null
      };

      const stagesContainer = document.getElementById('stages');
      const orderFilter = document.getElementById('order-filter');
      const ordersBody = document.getElementById('orders-body');
      const ordersEmpty = document.getElementById('orders-empty');
      const stageTitle = document.getElementById('stage-title');
      const lastUpdate = document.getElementById('last-update');
      const ganttContainer = document.getElementById('gantt');
      const ganttEmpty = document.getElementById('gantt-empty');
      const routesContainer = document.getElementById('routes');
      const routesEmpty = document.getElementById('routes-empty');

      orderFilter.addEventListener('change', () => {
        state.filter = orderFilter.value;
        renderAll();
      });

      function formatDate(value) {
        if (!value) return '—';
        const date = new Date(value);
        if (Number.isNaN(date.valueOf())) return '—';
        return date.toLocaleString('ru-RU', {
          day: '2-digit',
          month: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        });
      }

      function formatDateShort(value) {
        if (!value) return '—';
        const date = new Date(value);
        if (Number.isNaN(date.valueOf())) return '—';
        return date.toLocaleDateString('ru-RU', {
          day: '2-digit',
          month: '2-digit'
        });
      }

      function formatPercent(progress) {
        if (!Number.isFinite(progress)) return '—';
        return `${Math.max(0, Math.min(100, Math.round(progress)))}%`;
      }

      function isLate(entry) {
        if (!entry.planned_end || entry.is_done) return false;
        const planned = new Date(entry.planned_end);
        if (Number.isNaN(planned.valueOf())) return false;
        return planned.getTime() < Date.now();
      }

      function setStageOrder(row) {
        const orderIds = Array.isArray(row.order_uids)
          ? row.order_uids
              .map((uid) => {
                if (typeof uid === 'string' && uid.startsWith('order-')) {
                  const parsed = Number.parseInt(uid.slice(6), 10);
                  return Number.isInteger(parsed) ? parsed : null;
                }
                if (Number.isInteger(uid)) return uid;
                return null;
              })
              .filter((id) => id !== null)
          : [];
        state.stageOrders.set(row.stage_code, {
          version: row.row_version ?? 0,
          orderIds
        });
      }

      function upsertOrderProcess(entry) {
        state.orderProcessesById.set(entry.id, entry);
        const list = state.orderProcessesByOrder.get(entry.order_id) || [];
        const idx = list.findIndex((item) => item.id === entry.id);
        if (idx >= 0) {
          list[idx] = entry;
        } else {
          list.push(entry);
        }
        list.sort((a, b) => {
          const seqA = Number.isFinite(a.seq) ? a.seq : Number.MAX_SAFE_INTEGER;
          const seqB = Number.isFinite(b.seq) ? b.seq : Number.MAX_SAFE_INTEGER;
          if (seqA !== seqB) return seqA - seqB;
          return a.id - b.id;
        });
        state.orderProcessesByOrder.set(entry.order_id, list);
      }

      function removeOrderProcess(id) {
        const existing = state.orderProcessesById.get(id);
        if (!existing) return;
        state.orderProcessesById.delete(id);
        const list = state.orderProcessesByOrder.get(existing.order_id);
        if (!list) return;
        const idx = list.findIndex((item) => item.id === id);
        if (idx >= 0) {
          list.splice(idx, 1);
        }
        if (list.length === 0) {
          state.orderProcessesByOrder.delete(existing.order_id);
        }
      }

      async function loadInitialData() {
        try {
          const [processesRes, ordersRes, stageOrdersRes, orderProcessRes] = await Promise.all([
            fetchJson('/api/processes'),
            fetchJson('/api/orders?limit=500'),
            fetchJson('/api/planner/stage-orders?sinceVersion=0'),
            fetchJson('/api/order-process')
          ]);

          state.processes = Array.isArray(processesRes.items) ? processesRes.items : [];
          if (!state.selectedStage && state.processes.length) {
            state.selectedStage = state.processes[0].code;
          }

          (ordersRes.items || []).forEach((order) => {
            state.orders.set(order.id, order);
          });

          (stageOrdersRes.items || []).forEach(setStageOrder);

          state.orderProcessesById.clear();
          state.orderProcessesByOrder.clear();
          (orderProcessRes.items || []).forEach(upsertOrderProcess);

          state.lastUpdate = new Date();
          renderAll();
          startEvents();
        } catch (err) {
          console.error('Не удалось загрузить данные', err);
          stageTitle.textContent = 'Ошибка загрузки данных';
          ordersBody.innerHTML = '';
          ordersEmpty.hidden = false;
        }
      }

      function fetchJson(url, options) {
        return fetch(url, options).then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        });
      }

      function renderStages() {
        stagesContainer.innerHTML = '';
        state.processes.forEach((process) => {
          const btn = document.createElement('button');
          btn.className = 'stage-btn';
          btn.type = 'button';
          btn.textContent = process.name || process.code;
          if (process.code === state.selectedStage) {
            btn.classList.add('active');
          }
          btn.addEventListener('click', () => {
            state.selectedStage = process.code;
            renderAll();
          });
          stagesContainer.appendChild(btn);
        });
      }

      function getStageEntries(stageCode) {
        const directOrderIds = state.stageOrders.get(stageCode)?.orderIds || [];
        if (directOrderIds.length) {
          const entries = [];
          for (const orderId of directOrderIds) {
            const processes = state.orderProcessesByOrder.get(orderId) || [];
            const match = processes.find((item) => item.process_code === stageCode);
            if (match) entries.push(match);
          }
          return entries;
        }

        const entries = [];
        for (const [orderId, processes] of state.orderProcessesByOrder.entries()) {
          const match = processes.find((item) => item.process_code === stageCode);
          if (match) entries.push(match);
        }
        entries.sort((a, b) => {
          const startA = a.planned_start ? new Date(a.planned_start).getTime() : Infinity;
          const startB = b.planned_start ? new Date(b.planned_start).getTime() : Infinity;
          if (startA !== startB) return startA - startB;
          return a.order_id - b.order_id;
        });
        return entries;
      }

      function getOrderRow(entry) {
        const order = state.orders.get(entry.order_id);
        return order || {
          id: entry.order_id,
          number: `#${entry.order_id}`,
          status: 'unknown'
        };
      }

      function filterEntries(entries) {
        switch (state.filter) {
          case 'current':
            return entries.filter((entry) => !entry.is_done);
          case 'done':
            return entries.filter((entry) => !!entry.is_done);
          case 'late':
            return entries.filter((entry) => isLate(entry));
          default:
            return entries;
        }
      }

      function renderOrdersTable() {
        const stageCode = state.selectedStage;
        const process = state.processes.find((p) => p.code === stageCode);
        stageTitle.textContent = process ? `Передел «${process.name || process.code}»` : 'Неизвестный передел';
        lastUpdate.textContent = state.lastUpdate ? `Обновлено ${formatDate(state.lastUpdate)}` : '';

        const entries = filterEntries(getStageEntries(stageCode));
        ordersBody.innerHTML = '';
        if (!entries.length) {
          ordersEmpty.hidden = false;
          return;
        }
        ordersEmpty.hidden = true;

        entries.forEach((entry) => {
          const order = getOrderRow(entry);
          const tr = document.createElement('tr');
          const isEntryLate = isLate(entry);
          tr.innerHTML = `
            <td>
              <div><strong>${order.number || order.crm_order_id || 'Без номера'}</strong></div>
              <div style="font-size:0.8rem;color:rgba(30,36,50,0.6);">ID: ${order.id}</div>
            </td>
            <td>${renderStatusBadge(entry, order)}</td>
            <td>
              <div>${formatDateShort(entry.planned_start)} → ${formatDateShort(entry.planned_end)}</div>
            </td>
            <td>
              <div>${formatDateShort(entry.actual_start)} → ${formatDateShort(entry.actual_end)}</div>
            </td>
            <td>${formatPercent(entry.progress)}</td>
          `;
          if (isEntryLate) {
            tr.classList.add('is-late');
          }
          ordersBody.appendChild(tr);
        });
      }

      function renderStatusBadge(entry, order) {
        if (entry.is_done) {
          return '<span class="badge done">Готово</span>';
        }
        if (isLate(entry)) {
          return '<span class="badge late">Опоздание</span>';
        }
        const status = order?.status ? String(order.status).replace(/_/g, ' ') : 'В работе';
        return `<span class="badge">${status}</span>`;
      }

      function renderGantt() {
        const entries = filterEntries(getStageEntries(state.selectedStage)).filter((entry) => entry.planned_start && entry.planned_end);
        ganttContainer.innerHTML = '';
        if (!entries.length) {
          ganttEmpty.hidden = false;
          return;
        }
        ganttEmpty.hidden = true;

        const ranges = entries.map((entry) => [new Date(entry.planned_start).getTime(), new Date(entry.planned_end).getTime()]);
        const min = Math.min(...ranges.map((r) => r[0]));
        const max = Math.max(...ranges.map((r) => r[1]));
        const span = Math.max(1, max - min);

        entries.forEach((entry) => {
          const order = getOrderRow(entry);
          const start = new Date(entry.planned_start).getTime();
          const end = new Date(entry.planned_end).getTime();
          const offset = ((start - min) / span) * 100;
          const width = Math.max(2, ((end - start) / span) * 100);

          const row = document.createElement('div');
          row.className = 'gantt-row';

          const label = document.createElement('div');
          label.className = 'gantt-label';
          label.textContent = order.number || order.crm_order_id || `#${order.id}`;

          const track = document.createElement('div');
          track.className = 'gantt-bar-track';

          const bar = document.createElement('div');
          bar.className = 'gantt-bar';
          if (entry.is_done) {
            bar.classList.add('done');
          } else if (isLate(entry)) {
            bar.classList.add('late');
          }
          bar.style.left = `${offset}%`;
          bar.style.width = `${Math.min(100, width)}%`;
          track.appendChild(bar);

          row.appendChild(label);
          row.appendChild(track);
          ganttContainer.appendChild(row);
        });
      }

      function renderRoutes() {
        const entries = filterEntries(getStageEntries(state.selectedStage));
        routesContainer.innerHTML = '';
        if (!entries.length) {
          routesEmpty.hidden = false;
          return;
        }
        routesEmpty.hidden = true;

        entries.forEach((entry) => {
          const order = getOrderRow(entry);
          const processes = state.orderProcessesByOrder.get(entry.order_id) || [];
          const card = document.createElement('div');
          card.className = 'route-card';

          const header = document.createElement('h3');
          header.innerHTML = `${order.number || order.crm_order_id || 'Заказ'} <span>ID: ${order.id}</span>`;
          card.appendChild(header);

          const grid = document.createElement('div');
          grid.className = 'route-stages';

          processes.forEach((proc) => {
            const stage = document.createElement('div');
            stage.className = 'route-stage';
            const processInfo = state.processes.find((p) => p.id === proc.process_id || p.code === proc.process_code);
            stage.innerHTML = `
              <strong>${processInfo?.name || proc.process_code}</strong>
              <span>${renderRouteStageStatus(proc)}</span>
              <span>План: ${formatDateShort(proc.planned_start)} → ${formatDateShort(proc.planned_end)}</span>
            `;
            grid.appendChild(stage);
          });

          card.appendChild(grid);
          routesContainer.appendChild(card);
        });
      }

      function renderRouteStageStatus(proc) {
        if (proc.is_done) return 'Готово';
        if (isLate(proc)) return 'Опоздание';
        if (Number.isFinite(proc.progress)) return `Прогресс: ${formatPercent(proc.progress)}`;
        return 'В работе';
      }

      function renderAll() {
        renderStages();
        renderOrdersTable();
        renderGantt();
        renderRoutes();
      }

      function startEvents() {
        if (state.eventSource) {
          state.eventSource.close();
        }
        const es = new EventSource('/api/events');
        es.addEventListener('message', (event) => {
          if (!event.data) return;
          const payload = JSON.parse(event.data);
          applyDelta(payload);
        });
        es.addEventListener('error', () => {
          console.warn('SSE connection lost, retrying…');
        });
        state.eventSource = es;
      }

      function applyDelta(event) {
        let touched = false;
        if (Array.isArray(event.orders)) {
          event.orders.forEach((item) => {
            if (item?.data) {
              state.orders.set(item.data.id, item.data);
              touched = true;
            }
          });
        }
        if (Array.isArray(event.order_process)) {
          event.order_process.forEach((item) => {
            if (item?.data) {
              upsertOrderProcess(item.data);
              touched = true;
            }
          });
        }
        if (Array.isArray(event.stage_orders)) {
          event.stage_orders.forEach(setStageOrder);
          touched = true;
        }
        if (Array.isArray(event.settings_shared) || Array.isArray(event.settings_misc)) {
          touched = true;
        }
        if (touched) {
          state.lastUpdate = new Date();
          renderAll();
        }
      }

      loadInitialData();
    </script>
  </body>
</html>
