<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Единая система · Вход</title>
  <link rel="stylesheet" href="/assets/app.css" />
  <script src="/assets/app.js" defer></script>
  <style>
    body { display: flex; align-items: center; justify-content: center; padding: 32px; }
    .auth-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 28px; display: flex; flex-direction: column; gap: 22px; }
    .auth-card header { display: flex; flex-direction: column; gap: 6px; }
    .auth-card header h1 { font-size: 22px; }
    .auth-card form { display: flex; flex-direction: column; gap: 14px; }
    .auth-card .actions { display: flex; flex-direction: column; gap: 10px; }
    .auth-card footer { font-size: 13px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="auth-card">
    <header>
      <h1>Объединённая CRM + Планировщик</h1>
      <p>Введите корпоративную почту и пароль, чтобы продолжить.</p>
    </header>
    <form id="login-form">
      <label class="field">
        Email
        <input type="text" name="email" autocomplete="username" placeholder="user@example.com" required />
      </label>
      <label class="field">
        Пароль
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <div class="actions">
        <button type="submit" class="btn">Войти</button>
        <button type="button" id="demo-login" class="btn secondary">Использовать демо-аккаунт</button>
      </div>
    </form>
    <footer>
      © Единая система планирования, 2025
    </footer>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const me = await App.fetchCurrentUser();
        if (me) {
          window.location.href = '/planner.html';
          return;
        }
      } catch (err) {
        // ignore
      }

      const form = document.getElementById('login-form');
      const demoBtn = document.getElementById('demo-login');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(form);
        const email = formData.get('email');
        const password = formData.get('password');
        try {
          const response = await App.apiFetch('/api/auth/login', {
            method: 'POST',
            body: { email, password }
          });
          if (response?.role) {
            App.showToast('Добро пожаловать!', 'success');
          }
          setTimeout(() => {
            window.location.href = '/planner.html';
          }, 400);
        } catch (err) {
          if (err.status === 401) {
            App.showToast('Неверный email или пароль', 'error');
          } else if (err.status === 403) {
            App.showToast('Пользователь деактивирован', 'warning');
          } else {
            App.showToast('Не удалось выполнить вход. Попробуйте позже.', 'error');
          }
        }
      });

      demoBtn.addEventListener('click', () => {
        const emailField = form.querySelector('input[name="email"]');
        const passwordField = form.querySelector('input[name="password"]');
        emailField.value = 'admin@example.com';
        passwordField.value = 'Admin123!';
      });
    });
  </script>
</body>
</html>
