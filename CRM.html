<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mini CRM v13c — Orders · Stages</title>
<style>
  :root{
    --bg:#0f1115; --card:#161a22; --muted:#8b95a7; --text:#e7ecf3;
    --primary:#4da3ff; --accent:#9bffd6; --warn:#ffce4d; --danger:#ff6b6b;
    --ok:#24a148; --okGlow:rgba(36,161,72,.22);
    --chip:#232a36; --border:#232936; --shadow:0 6px 24px rgba(0,0,0,.35);
    --col-min:320px; --dlgBorder:#5ca0ff; --tooltipBg:#0c111a; --tooltipBd:#2a3548;
    --readyOffBd:#3b4a63; --readyOffBg:#0e131b;
    --inputBg:#0b0e13; --inputDisabled:#0a0f16; --placeholder:#77829a;
  }
  :root[data-theme="light"]{
    --bg:#f6f7fb; --card:#ffffff; --muted:#5a667a; --text:#0e1320;
    --primary:#1b5cff; --accent:#00a884; --warn:#b57a00; --danger:#cc3a3a;
    --ok:#1f8e41; --okGlow:rgba(31,142,65,.22);
    --chip:#f0f3f9; --border:#d9deea; --shadow:0 8px 24px rgba(0,0,0,.08);
    --tooltipBg:#fff; --tooltipBd:#e5eaf5;
    --readyOffBd:#b9c3d6; --readyOffBg:#ffffff;
    --inputBg:#ffffff; --inputDisabled:#f4f6fb; --placeholder:#9aa5b4;
  }

  body{margin:0;background:linear-gradient(180deg,#0e1117,#0b0d12);color:var(--text);font:14px/1.4 system-ui,Segoe UI,Roboto,Ubuntu,Arial,sans-serif}
  body[data-theme="light"]{ background:linear-gradient(180deg,#f8faff,#eef2f8) }
  header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.8);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .bar{display:flex;gap:8px;align-items:center;padding:12px 14px;flex-wrap:wrap}
  .bar h1{font-size:16px;margin:0 8px 0 0;opacity:.9}

  /* Базовые элементы */
  select, input[type="text"], input[type="number"], input[type="date"], textarea{
    background:var(--inputBg); border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:8px 10px; outline:none; box-sizing:border-box;
    transition:border-color .15s, box-shadow .15s, background-color .15s;
  }
  input::placeholder, textarea::placeholder{ color:var(--placeholder) }
  input:focus, select:focus, textarea:focus{ box-shadow:0 0 0 3px rgba(77,163,255,.22); border-color:#4da3ff }
  input:disabled, select:disabled{ background:var(--inputDisabled); color:var(--muted); opacity:1 }

  /* Кнопки */
  button{
    background:#111826;border:1px solid var(--border);color:var(--text);
    padding:8px 12px;border-radius:10px;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .08s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease
  }
  body[data-theme="light"] button{ background:#f6f7fb }
  button.primary{background:linear-gradient(90deg,#1b3b68,#1e2340);border:1px solid #294a7a}
  button.ghost{background:transparent;border-color:transparent}
  button.danger{background:linear-gradient(90deg,#3b1415,#2b0e0f);border:1px solid #5c1e22}
  body[data-theme="light"] .btn-circle.danger,
  body[data-theme="light"] button.danger{ background:#ffe8e8; border-color:#f5b3b3; color:#cc3a3a }
  button:disabled{opacity:.5;cursor:not-allowed}
  button:active{ transform: translateY(1px) scale(.98) }
  button:focus-visible{ box-shadow:0 0 0 3px rgba(77,163,255,.35) }
  .ripple{position:absolute;border-radius:50%;transform:scale(0);animation:ripple .6s linear;pointer-events:none;background:rgba(255,255,255,.28)}
  @keyframes ripple{to{transform:scale(12);opacity:0}}

  .grow{flex:1}
  .boards{display:flex;gap:14px;align-items:center}
  .pill{padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:#0b0e13}
  body[data-theme="light"] .pill{ background:#fff }
  .toast{position:fixed;top:26px;right:26px;z-index:1200;min-width:220px;max-width:320px;padding:14px 18px;border-radius:14px;border:1px solid transparent;box-shadow:0 18px 32px rgba(0,0,0,.35);background:rgba(15,20,30,.92);color:var(--text);opacity:0;pointer-events:none;transform:translateY(-10px);transition:opacity .2s ease,transform .2s ease}
  body[data-theme="light"] .toast{background:#fff;color:#0f172a;box-shadow:0 16px 24px rgba(15,23,42,.12)}
  .toast.show{opacity:1;pointer-events:auto;transform:translateY(0)}
  .toast.success{border-color:#1f8e41;color:#b6ff8a}
  .toast.warn{border-color:#b57a00;color:#ffd88a}
  .toast.error{border-color:#cc3a3a;color:#ff9f9f}
  main{padding:16px}
  .columns{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
  .columns::-webkit-scrollbar{height:8px}
  .columns::-webkit-scrollbar-thumb{background:#2a3342;border-radius:8px}
  body[data-theme="light"] .columns::-webkit-scrollbar-thumb{background:#c4ccda}
  .col{background:var(--card);border:1px solid var(--border);border-radius:16px;min-height:120px;box-shadow:var(--shadow);flex:0 0 var(--col-min);min-width:var(--col-min)}
  .col header{position:relative;background:transparent;border-bottom:1px dashed var(--border)}
  .col h2{font-size:13px;letter-spacing:.2px;margin:0;padding:10px 12px;color:var(--muted)}
  .drop{padding:10px;display:flex;flex-direction:column;gap:10px;min-height:100px}
  .card{background:#111620;border:1px solid #1f2632;border-radius:14px;padding:10px;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:grab;position:relative}
  body[data-theme="light"] .card{ background:#fff; border-color:#e6eaf3 }
  .card.dragging{opacity:.5}
  .card .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .rowc{display:flex;align-items:center;gap:8px}
  .title{font-weight:600;display:flex;align-items:center;gap:8px}
  .sub{color:var(--muted);font-size:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:var(--chip);border:1px solid var(--border);color:#cfe5ff;padding:4px 8px;border-radius:999px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
  .chip img{width:14px;height:14px;display:block}
  .chip.warn{color:#ffd88a;border-color:#4a3a12}
  .chip.danger{color:#ff9f9f;border-color:#4a1719}
  .chip.ok{color:#b6ff8a;border-color:#173a15}
  body[data-theme="light"] .chip{ color:#0e1320 }
  .kebab{margin-left:auto}
  .muted{color:var(--muted)}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .progress{height:6px;background:#0b0e13;border:1px solid var(--border);border-radius:999px;overflow:hidden;flex:1}
  body[data-theme="light"] .progress{ background:#eef2f9; border-color:#d9deea }
  .progress>i{display:block;height:100%;background:linear-gradient(90deg,#4da3ff,#9bffd6);width:0%}
  .empty{opacity:.6;font-style:italic;padding:10px}

  /* Диалоги */
  dialog{border:2px solid var(--dlgBorder);border-radius:16px;padding:0;max-width:980px;width:96%;background:#0e131b;color:var(--text);box-shadow:0 0 0 6px rgba(92,160,255,.15),0 24px 48px rgba(0,0,0,.6)}
  body[data-theme="light"] dialog{background:#fff;color:#0e1320;box-shadow:0 0 0 6px rgba(27,92,255,.08),0 24px 48px rgba(0,0,0,.12)}
  .dlg-head{padding:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,#0f1520,#0a0f17)}
  body[data-theme="light"] .dlg-head{background:linear-gradient(180deg,#f7f9fe,#eef2f8)}
  .dlg-body{padding:14px;display:grid;gap:12px}

  .surface{
    border:1px solid var(--border);
    border-radius:18px;
    background:linear-gradient(180deg,rgba(27,40,61,.7),rgba(15,20,30,.72));
    box-shadow:0 20px 42px rgba(0,0,0,.35);
  }
  body[data-theme="light"] .surface{
    background:linear-gradient(180deg,#fff,#eef3fb);
    box-shadow:0 18px 34px rgba(27,92,255,.08);
  }

  /* Шапка редактора: единый современный стиль полей */
  .gridHead{
    display:grid;
    gap:12px 14px;
    grid-template-columns:minmax(340px,4.8fr) minmax(220px,2.4fr) minmax(150px,1.3fr) minmax(150px,1.3fr);
    grid-auto-rows:auto;
    padding:16px 18px 18px;
  }
  .gridHead > div{
    display:flex; flex-direction:column; gap:4px;
    position:relative;
  }
  .gridHead > div label{
    display:block; font-size:11px; letter-spacing:.04em;
    text-transform:uppercase; color:var(--muted);
    margin-left:2px; user-select:none;
  }
  .gridHead input{border-radius:16px;}
  /* Все поля формы заказа — единый стиль */
  #orderForm input[type="text"],
  #orderForm input[type="number"],
  #orderForm input[type="date"],
  #orderForm select,
  #orderForm textarea{
    min-height:36px; padding:8px 12px;
    border-radius:14px; border:1px solid rgba(116,136,170,.45);
    background:linear-gradient(180deg,var(--inputBg),rgba(12,16,24,.96));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    font-size:14px;
    transition:border-color .15s, box-shadow .15s, background-color .15s;
  }
  body[data-theme="light"] #orderForm input,
  body[data-theme="light"] #orderForm select,
  body[data-theme="light"] #orderForm textarea{
    background:linear-gradient(180deg,#fff,#f4f6fb);
    border-color:rgba(161,175,206,.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
  }
  #orderForm textarea{min-height:60px; resize:vertical;}
  #orderForm select{
    appearance:none; padding-right:44px;
    background:linear-gradient(180deg,var(--inputBg),rgba(12,16,24,.96));
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18"><path d="M4.5 6.75 9 11.25l4.5-4.5" fill="none" stroke="%239ba7bc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    background-repeat:no-repeat;
    background-position:right 16px center;
    background-size:14px 14px;
  }
  body[data-theme="light"] #orderForm select{
    background:linear-gradient(180deg,#fff,#f4f6fb);
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18"><path d="M4.5 6.75 9 11.25l4.5-4.5" fill="none" stroke="%23586a8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  }
  #orderForm input[type="date"]{font-variant-numeric:tabular-nums;}
  #orderForm :is(input,select,textarea):disabled{
    background:var(--inputDisabled);
    color:var(--muted);
    border-color:rgba(104,122,152,.45);
    box-shadow:none;
  }
  /* Выравнивание по сетке */
  .gridHead .title{
    grid-column:1;
    grid-row:1;
    align-self:stretch;
  }
  .gridHead .service{grid-column:3;grid-row:1;}
  .gridHead .start{grid-column:4;grid-row:1;}
  .gridHead .customer{grid-column:1;grid-row:2;}
  .gridHead .orderNo{grid-column:2;grid-row:2;}
  .gridHead .progressField{grid-column:3;grid-row:2;}
  .gridHead .end{grid-column:4;grid-row:2;}

  #orderForm input[name="title"]{width:100%;}

  @media (max-width: 920px){
    .gridHead{
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    }
    .gridHead > div{grid-column:auto!important;grid-row:auto!important;}
    .gridHead .title{width:100%;}
  }

  /* Унифицированные панели внутри формы заказа */
  .section-card{padding:20px 22px;}
  details.section-card{padding:0;overflow:hidden;}
  details.section-card > summary{
    padding:18px 22px;
    cursor:pointer;
    font-weight:600;
    letter-spacing:.02em;
    display:flex;align-items:center;gap:10px;
    list-style:none;
  }
  details.section-card > summary::-webkit-details-marker{display:none;}
  details.section-card > summary::before{
    content:"";
    width:10px;height:10px;flex:0 0 10px;
    border:2px solid var(--muted);
    border-left-width:0;border-bottom-width:0;
    transform:rotate(45deg);
    transition:transform .2s ease;
    margin-right:6px;
  }
  details.section-card[open] > summary::before{transform:rotate(135deg);}
  details.section-card[open] > summary{border-bottom:1px solid var(--border);}
  details.section-card .section-body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:18px;}

  .section-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
  .section-toolbar .left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .section-toolbar .left label{gap:8px;}
  .section-toolbar .right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto;}
  .section-toolbar .note{font-size:11px;color:var(--muted);}

  .form-footer{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:16px 18px;}
  .form-footer .status-field{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:220px;}
  .form-footer .status-field label{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-left:2px;}
  .form-footer .status-field select{width:100%;}
  .form-footer .actions{display:flex;align-items:center;gap:10px;margin-left:auto;}

  #orderForm textarea{width:100%;}
  #stagesTable input,#stagesTable select{padding:4px 6px;min-height:0;border-radius:10px;box-shadow:none;background:var(--inputBg);}
  #stagesTable select{background-image:none;padding-right:8px;}
  body[data-theme="light"] #stagesTable input,
  body[data-theme="light"] #stagesTable select{background:#fff;box-shadow:none;border-color:#d0d9ec;}

  /* Таблица переделов */
  table{width:100%;border-collapse:collapse;table-layout:fixed}
  th,td{border:1px solid var(--border);padding:3px 8px;vertical-align:middle}
  body[data-theme="light"] th,body[data-theme="light"] td{border-color:#e5eaf5}
  th{color:var(--muted);font-weight:600}
  #stagesTable th:first-child,#stagesTable td:first-child{text-align:left}
  #stagesTable th:not(:first-child),#stagesTable td:not(:first-child){text-align:center}
  #stagesTable td input,#stagesTable td select{width:100%}
  #stagesTable thead th:nth-child(1){width:24%}
  #stagesTable thead th:nth-child(2){width:7%}
  #stagesTable thead th:nth-child(3){width:11%}
  #stagesTable thead th:nth-child(4){width:18%}
  #stagesTable thead th:nth-child(5){width:18%}
  #stagesTable thead th:nth-child(6){width:16%}
  #stagesTable thead th:nth-child(7){width:6%}
  #stagesTable input[data-k="progress"]{max-width:72px;text-align:center;margin:auto}
  #stagesTable input[data-k="start"],#stagesTable input[data-k="end"]{max-width:128px;text-align:center;margin:auto}
  #stagesTable input[data-k="value"]{max-width:240px;width:100%;text-align:center;margin:auto}
  #stagesTable input.stg-name{padding:4px 6px}
  #stagesTable td.chk{padding:3px 8px}

  #orderForm details{grid-column:1 / -1}
  #orderForm details textarea{width:100%;resize:vertical}

  /* Кружки «Готово» (20px) */
  .ready-switch{
    appearance:none;aspect-ratio:1/1;width:20px!important;height:auto;
    border:2px solid var(--readyOffBd)!important;border-radius:50%;
    background:var(--readyOffBg);display:inline-grid;place-content:center;
    cursor:pointer;transition:border-color .15s,box-shadow .15s,background-color .15s;
    vertical-align:middle;box-sizing:content-box
  }
  .ready-switch:hover{box-shadow:0 0 0 3px rgba(77,163,255,.12) inset}
  .ready-switch::after{content:"";width:12px;height:12px;background-repeat:no-repeat;background-position:center;background-size:12px 12px;opacity:0;transition:.15s}
  .ready-switch:checked{border-color:var(--ok);background:radial-gradient(circle at 50% 50%,rgba(36,161,72,.16),rgba(36,161,72,.06));box-shadow:0 0 0 3px var(--okGlow) inset}
  .ready-switch:checked::after{opacity:1;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 14 14"><path d="M3 7l2.8 3L11 4.2" fill="none" stroke="%2324a148" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>')}
  .card .ready-switch.card-ready{margin-right:8px}

  .ready-btn{aspect-ratio:1/1;width:10px;height:auto;border:1.2px solid var(--readyOffBd);border-radius:50%;display:none}
  .btn-circle{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0}

  .popup{position:fixed;z-index:9999;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:6px}
  .popup h4{margin:6px 8px;font-size:12px;color:var(--muted)}
  .popup .item{padding:6px 10px;border-radius:8px;cursor:pointer}
  .popup .item:hover{background:rgba(77,163,255,.12)}

  .tt{position:fixed;z-index:9998;background:var(--tooltipBg);color:var(--text);border:1px solid var(--tooltipBd);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:12px;max-width:320px;pointer-events:none}
  .tt h5{margin:0 0 6px 0;font-size:12px;color:var(--muted)}
  .tt ul{margin:0;padding-left:16px}
  .tt li{margin:2px 0}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Mini CRM</h1>
    <span class="pill" id="sseStatus" title="Статус подключения">🟡 Проверка…</span>
    <div class="boards">
      <label class="muted">Доска</label>
      <select id="boardSelect"></select>
      <button id="addBoardBtn">+ Доска</button>
      <button id="editBoardBtn">Настроить</button>
      <span class="pill muted" id="stats">—</span>
    </div>
    <input id="q" class="grow" type="text" placeholder="Поиск: № заказа, имя, переделы…" />
    <button id="newOrderBtn" class="primary">+ Заказ</button>
    <button id="plannerBtn" class="ghost" title="Перейти в Планировщик">Планировщик</button>
    <button id="importCsvBtn" title="Импорт CSV в CRM">⬆ CSV</button>
    <button id="exportCsvBtn" title="Экспорт CRM → CSV">⬇ CSV</button>
    <button id="exportBtn" title="Экспорт JSON">⭳</button>
    <button id="importBtn" title="Импорт JSON">⭱</button>
    <input id="importInput" type="file" accept="application/json" hidden />
    <input id="importCsvInput" type="file" accept="text/csv,.csv" hidden />
    <button id="themeBtn" title="Переключить тему">🌙</button>
  </div>
</header>

<main><div class="columns" id="columns"></div></main>

<!-- Диалог заказа -->
<dialog id="orderDlg">
  <div class="dlg-head">
    <strong id="dlgTitle">Редактировать заказ</strong>
    <div class="rowc">
      <label class="rowc"><input id="orderDone" class="ready-switch" type="checkbox" /> Заказ готов</label>
      <button class="ghost" id="splitBtn" title="Разбить на подзаказ">➗ Подзаказ</button>
      <button class="ghost" onclick="closeOrder()">✖</button>
    </div>
  </div>
  <form id="orderForm" class="dlg-body" method="dialog">
    <div class="gridHead surface">
      <div class="title"><label>Название заказа</label><input name="title" required placeholder="ВЗПС-021612 АБХМ (Фортес Групп)" /></div>
      <div class="service"><label>Сумма услуг, ₽</label><input name="serviceTotal" type="text" inputmode="decimal" placeholder="0" /></div>
      <div class="start"><label>Начало (авто)</label><input name="start" type="date" disabled /></div>

      <div class="customer"><label>Клиент</label><input name="customer" placeholder="АБХМ" /></div>
      <div class="orderNo"><label>№ заказа</label><input name="orderNo" required placeholder="ВЗПС-021612" /></div>
      <div class="progressField"><label>Общий прогресс, %</label><input name="progress" type="number" min="0" max="100" value="0" disabled /></div>
      <div class="end"><label>Конец (авто)</label><input name="end" type="date" disabled /></div>
    </div>

    <details class="section-card surface" open>
      <summary>План переделов (статус, % выполнения, сроки, Руб/часов)</summary>
      <div class="section-body">
        <div class="list">
          <table id="stagesTable">
            <thead><tr><th>Передел</th><th>Готово</th><th>% вып.</th><th>Начало</th><th>Конец</th><th>Руб/часов</th><th></th></tr></thead>
          <tbody></tbody></table>

          <div class="section-toolbar">
            <div class="left">
              <label class="rowc"><input id="dateToday" type="checkbox" class="ready-switch" /> Даты=сегодня</label>
              <span class="note">Галочка «Готово» = 100% по переделу.</span>
            </div>
            <div class="right">
              <button type="button" id="addStageBtn">+ Передел</button>
              <button type="button" id="presetStagesBtn">🔁 Базовые</button>
            </div>
          </div>
        </div>
      </div>
    </details>
    <details class="section-card surface" open>
      <summary>Описание/исключения</summary>
      <div class="section-body">
        <textarea name="notes" rows="2" placeholder="Краткое ТЗ, исключения, кооперация…"></textarea>
      </div>
    </details>

    <div class="section-card surface form-footer">
      <div class="status-field">
        <label for="statusSel">Состояние</label>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const $=(s,r=document)=>r.querySelector(s); const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY='mini_crm_v13c';
const toastEl=$('#toast');
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>d.toISOString().slice(0,10);
const iconPart=()=>'data:image/svg+xml;base64,'+btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><circle cx="32" cy="32" r="28" fill="#1b3b68"/><path d="M32 4a28 28 0 0 1 0 56z" fill="#4da3ff"/></svg>`);
const iconRest=()=>'data:image/svg+xml;base64,'+btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><circle cx="32" cy="32" r="28" fill="#15341e"/><path d="M32 4a28 28 0 0 0 0 56z" fill="#70e000"/></svg>`);

const DEFAULT_LANES=['Не запланированное','Клиент','Отдел продаж','Технологи','Производство','Закупка','Упаковка','Готово (Ож. отгрузки)','Отгружено'];
const DEFAULT_STAGES=['Подготовка в работу','Закупка','Рубка','Лазер','Гибка','Сварка','Мехобработка','Упаковка','Отгрузка'];
const defaultBoard=()=>({id:crypto.randomUUID(),name:'Список заказов',lanes:[...DEFAULT_LANES],orders:[]});

let toastTimer=null;
function showToast(message,type='info'){
  if(!toastEl) return;
  toastEl.textContent=message;
  toastEl.className='toast show '+(type==='success'?'success':type==='warn'?'warn':type==='error'?'error':'');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{toastEl.classList.remove('show','success','warn','error');},3600);
}

let state=load()??{boards:[defaultBoard()],currentBoardId:null}; if(!state.currentBoardId) state.currentBoardId=state.boards[0].id; save();
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function currentBoard(){return state.boards.find(b=>b.id===state.currentBoardId)}

const THEME_KEY='mini_crm_theme';
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);document.body.setAttribute('data-theme',t);localStorage.setItem(THEME_KEY,t);const btn=$('#themeBtn');if(btn) btn.textContent=t==='light'?'🌙':'☀️'}
applyTheme(localStorage.getItem(THEME_KEY)||'dark');
$('#themeBtn').onclick=()=>{const now=(document.documentElement.getAttribute('data-theme')==='light')?'dark':'light';applyTheme(now)};

function spanMuted(t){const s=document.createElement('span');s.className='muted';s.textContent=t;return s}
function chip(html,extra){const s=document.createElement('span');s.className='chip'+(extra?(' '+extra):'');s.innerHTML=html;return s}

const boardSelect=$('#boardSelect'),columns=$('#columns'),stats=$('#stats'),q=$('#q');

const remoteSync={user:null,sse:null,refreshing:false,syncing:false,pollTimer:null,pollInterval:2000,refreshQueued:false,offline:false};

function updateConnectionStatus(online){
  remoteSync.offline=!online;
  if(!sseStatus)return;
  if(online){sseStatus.textContent='🟢 Онлайн';sseStatus.classList.remove('warn','error');}
  else{sseStatus.textContent='🟡 Оффлайн';sseStatus.classList.add('warn');}
}

function scheduleRefresh(delay=400){
  if(remoteSync.refreshQueued)return;
  remoteSync.refreshQueued=true;
  setTimeout(async()=>{remoteSync.refreshQueued=false;await pullFromServer();},delay);
}

function renderBoardSelect(){boardSelect.innerHTML='';state.boards.forEach(b=>{const o=document.createElement('option');o.value=b.id;o.textContent=b.name;if(b.id===state.currentBoardId)o.selected=true;boardSelect.appendChild(o)})}
function renderColumns(){const b=currentBoard();columns.innerHTML='';b.lanes.forEach(l=>{const c=document.createElement('div');c.className='col';c.innerHTML=`<header><h2>${escapeHtml(l)}</h2></header><div class="drop" data-lane="${escapeHtml(l)}"></div>`;columns.appendChild(c)});enableDnd()}

function computeOrderDatesFromStages(o){const st=o.stages||[];const sd=st.map(x=>x.start).filter(Boolean).sort();const ed=st.map(x=>x.end).filter(Boolean).sort();o.start=sd[0]||'';o.end=ed[ed.length-1]||''}
function stagesDoneCount(o){const s=o.stages||[];const d=s.filter(x=>x.done||Number(x.progress||0)>=100).length;return[d,s.length]}

function renderCards(){
  const b=currentBoard(); const qv=q.value.trim().toLowerCase(); const map=Object.fromEntries(b.lanes.map(l=>[l,[]]));
  b.orders.forEach(o=>{
    computeOrderDatesFromStages(o);
    const inSearch=!qv||(o.title.toLowerCase().includes(qv)||(o.orderNo||'').toLowerCase().includes(qv)||(o.customer||'').toLowerCase().includes(qv)||(o.stages||[]).some(s=>s.name.toLowerCase().includes(qv)));
    if(!inSearch)return; const lane=map[o.status]?o.status:b.lanes[0]; map[lane].push(o);
  });
  $$('.drop',columns).forEach(d=>d.innerHTML='');

  Object.entries(map).forEach(([lane,arr])=>{
    const drop=$(`.drop[data-lane="${CSS.escape(lane)}"]`,columns);
    if(!arr.length){const p=document.createElement('div');p.className='empty';p.textContent='Пусто';drop.appendChild(p)}
    arr.forEach(o=>{
      const card=document.createElement('div');card.className='card';card.draggable=true;card.dataset.id=o.id;
      const progress=calcAutoProgress(o.stages); const [doneCnt,totalCnt]=stagesDoneCount(o);
      const chips=document.createElement('div');chips.className='chips';
      (o.stages||[]).forEach(st=>{if(st.value!==''&&st.value!==undefined&&st.value!==null){chips.appendChild(chip(`${escapeHtml(st.name)}: ${escapeHtml(st.value)}`))}});
      if(o.partOfPct)chips.appendChild(chip(`<img src="${iconPart()}"/>Часть (${o.partOfPct}%)`,'ok'));
      if(o.restOfPct)chips.appendChild(chip(`<img src="${iconRest()}"/>Остаток (${o.restOfPct}%)`,'warn'));
      if(o.serviceTotal!==''&&o.serviceTotal!=null)chips.appendChild(chip(`Сумма услуг: ${Number(o.serviceTotal).toLocaleString('ru-RU')} ₽`));
      if(o.start||o.end){const sd=o.start||'—';const ed=o.end||'—';chips.appendChild(chip(`${sd} — ${ed}`,'warn'))}
      const readyChecked=o.done?'checked':'';
      card.innerHTML=`
        <div class="row">
          <div class="title">
            <input type="checkbox" class="ready-switch card-ready" data-act="toggle-done" ${readyChecked} title="Отметить заказ готовым" />
            ${escapeHtml(o.title)}
          </div>
          <div class="kebab grow"></div>
          <button class="ghost" data-act="move" title="Переместить ↩">↩</button>
          <button class="ghost" data-act="edit" title="Открыть">✏️</button>
        </div>
        <div class="sub">№ ${escapeHtml(o.orderNo||'—')} · ${escapeHtml(o.customer||'Без клиента')}</div>`;
      card.appendChild(chips);
      const foot=document.createElement('div');foot.className='foot';
      const prog=document.createElement('div');prog.className='progress';const bar=document.createElement('i');bar.style.width=`${Math.max(0,Math.min(100,progress))}%`;prog.appendChild(bar);
      foot.appendChild(prog);foot.appendChild(spanMuted(`${doneCnt}/${totalCnt}`));card.appendChild(foot);

      card.addEventListener('click',e=>{
        const target=e.target; const act=target?.dataset?.act||target?.closest('[data-act]')?.dataset?.act;
        if(act==='edit'){e.stopPropagation();openOrder(o.id);return}
        if(act==='toggle-done'){e.stopPropagation();o.done=target.checked;if(o.done){(o.stages||[]).forEach(st=>{st.done=true;st.progress=100})}save();renderCards();return}
        if(act==='move'){e.stopPropagation();showMoveMenu(target.getBoundingClientRect(),o);return}
        openOrder(o.id);
      });
      card.addEventListener('mouseenter',()=>showTooltipForOrder(o,card));
      card.addEventListener('mouseleave',hideTooltip);
      drop.appendChild(card);
    })
  });
  const total=b.orders.length; const active=b.orders.filter(x=>x.status!==b.lanes[b.lanes.length-1]).length;
  stats.textContent=`Всего: ${total} • Активных: ${active}`;
}

function enableDnd(){
  let draggingId=null;
  columns.addEventListener('dragstart',e=>{const card=e.target.closest('.card');if(!card)return;draggingId=card.dataset.id;card.classList.add('dragging')});
  columns.addEventListener('dragend',e=>{const card=e.target.closest('.card');if(card)card.classList.remove('dragging');draggingId=null});
  $$('.drop',columns).forEach(d=>{
    d.addEventListener('dragover',e=>{e.preventDefault();d.style.outline='1px dashed #3a4a6b'});
    d.addEventListener('dragleave',()=>{d.style.outline='none'});
    d.addEventListener('drop',()=>{d.style.outline='none';if(!draggingId)return;const b=currentBoard();const o=b.orders.find(x=>x.id===draggingId);if(!o)return;o.status=d.dataset.lane;save();renderCards();syncOrderToServer(o,{silent:true}).catch(err=>{console.error(err);showToast(err.message||'Не удалось синхронизировать заказ','error');});});
  });
}

/* Popup перемещения */
let _popup;
function showMoveMenu(rect,order){
  closePopup(); const b=currentBoard(); const p=document.createElement('div');p.className='popup';p.innerHTML=`<h4>Переместить в:</h4>`;
  b.lanes.forEach(l=>{const it=document.createElement('div');it.className='item';it.textContent=l;it.onclick=()=>{if(confirm(`Переместить заказ в «${l}»?`)){order.status=l;save();renderCards();syncOrderToServer(order,{silent:true}).catch(err=>{console.error(err);showToast(err.message||'Не удалось синхронизировать заказ','error');});closePopup()}};p.appendChild(it)});
  document.body.appendChild(p); const x=Math.min(window.innerWidth-220,rect.left); const y=Math.min(window.innerHeight-300,rect.bottom+6); p.style.left=x+'px'; p.style.top=y+'px'; _popup=p;
  setTimeout(()=>document.addEventListener('click',clickAwayPopup,{once:true}),0);
}
function clickAwayPopup(e){if(!_popup)return;if(!e.target.closest('.popup'))closePopup()}
function closePopup(){if(_popup){_popup.remove();_popup=null}}

/* Tooltip */
let _tt;
function showTooltipForOrder(o,anchorEl){
  hideTooltip(); const tt=document.createElement('div');tt.className='tt';tt.innerHTML=`<h5>План переделов</h5><ul></ul>`;
  const ul=tt.querySelector('ul'); (o.stages||[]).forEach(st=>{const mark=(st.done||Number(st.progress||0)>=100)?'✓':'•';const li=document.createElement('li');li.textContent=`${mark} ${st.name}`;ul.appendChild(li)});
  document.body.appendChild(tt); const r=anchorEl.getBoundingClientRect(); const x=Math.min(window.innerWidth-tt.offsetWidth-10,r.right+10); const y=Math.max(10,r.top); tt.style.left=x+'px'; tt.style.top=y+'px'; _tt=tt;
}
function hideTooltip(){if(_tt){_tt.remove();_tt=null}}

/* ORDER DIALOG */
const orderDlg=$('#orderDlg'),orderForm=$('#orderForm'),statusSel=$('#statusSel'),deleteOrderBtn=$('#deleteOrderBtn'),dlgTitle=$('#dlgTitle'),orderDone=$('#orderDone'),addStageBtn=$('#addStageBtn'),presetStagesBtn=$('#presetStagesBtn'),stagesTableBody=$('#stagesTable tbody'),splitBtn=$('#splitBtn'),dateTodayChk=$('#dateToday');
const plannerBtn=$('#plannerBtn'),importCsvBtn=$('#importCsvBtn'),exportCsvBtn=$('#exportCsvBtn'),importCsvInput=$('#importCsvInput'),sseStatus=$('#sseStatus');

function openOrder(id=null){
  const b=currentBoard(); statusSel.innerHTML=''; b.lanes.forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l;statusSel.appendChild(o)}); stagesTableBody.innerHTML='';
  if(id){
    dlgTitle.textContent='Редактировать заказ'; const o=b.orders.find(x=>x.id===id); fillOrderForm(o,b);
    window._editingOrigValues=(o.childIds?.length?(o._origValues||null):null);
    deleteOrderBtn.style.display=''; deleteOrderBtn.onclick=()=>{if(!confirm('Удалить этот заказ?'))return; b.orders=b.orders.filter(x=>x.id!==o.id); save(); renderCards(); orderDlg.close(); if(o){syncDeleteOrder(o).catch(err=>{console.error(err);showToast(err.message||'Не удалось удалить заказ','error');});}};
  }else{
    dlgTitle.textContent='Новый заказ'; orderForm.reset(); orderForm.status.value=b.lanes[0]; orderForm.id.value=''; orderForm.progress.value=0; orderDone.checked=false;
    DEFAULT_STAGES.forEach(name=>appendStageRow({name,done:false,progress:0,start:'',end:'',value:''})); window._editingOrigValues=null; syncAutoDates(); deleteOrderBtn.style.display='none'; deleteOrderBtn.onclick=null;
  }
  addStageBtn.onclick=()=>appendStageRow({name:'Новый передел',done:false,progress:0,start:'',end:'',value:''});
  presetStagesBtn.onclick=()=>{stagesTableBody.innerHTML='';DEFAULT_STAGES.forEach(name=>appendStageRow({name,done:false,progress:0,start:'',end:'',value:''}));syncAutoProgress();syncAutoDates()};
  splitBtn.onclick=()=>openSplitDialog();
  dateTodayChk.onchange=()=>{if(!dateTodayChk.checked)return;const today=fmtDate(new Date());stagesTableBody.querySelectorAll('tr').forEach(tr=>{const s=tr.querySelector('[data-k="start"]');const e=tr.querySelector('[data-k="end"]');if(!s.value)s.value=today;if(!e.value)e.value=today});syncAutoDates()};
  orderDone.onchange=()=>{if(!orderDone.checked)return;stagesTableBody.querySelectorAll('tr').forEach(tr=>{const done=tr.querySelector('[data-k="done"]');const prog=tr.querySelector('[data-k="progress"]');if(done)done.checked=true;if(prog)prog.value=100});syncAutoProgress()};
  orderDlg.showModal();
}
function closeOrder(){orderDlg.close()}

function fillOrderForm(o,b){
  orderForm.title.value=o.title||''; orderForm.orderNo.value=o.orderNo||''; orderForm.customer.value=o.customer||'';
  orderForm.serviceTotal.value=(o.serviceTotal??'')===''?'':Number(o.serviceTotal).toLocaleString('ru-RU');
  orderForm.notes.value=o.notes||''; orderForm.status.value=o.status||b.lanes[0]; orderForm.id.value=o.id;
  (o.stages?.length?o.stages:DEFAULT_STAGES.map(n=>({name:n,done:false,progress:0,start:'',end:'',value:''}))).forEach(st=>appendStageRow(st));
  computeOrderDatesFromStages(o); orderForm.start.value=o.start||''; orderForm.end.value=o.end||''; orderForm.progress.value=calcAutoProgress(o.stages);
}

/* формат суммы */
(function(){const inp=$('#orderForm input[name="serviceTotal"]');function parseMoney(s){if(s==null)return'';s=String(s).replace(/\s+/g,'').replace(',', '.');const n=Number(s);return Number.isFinite(n)?n:''}function fmt(n){return(n===''?'':Number(n).toLocaleString('ru-RU'))}
if(inp){inp.addEventListener('focus',()=>{inp.value=String(inp.value).replace(/\s+/g,'')});inp.addEventListener('blur',()=>{const n=parseMoney(inp.value);inp.value=fmt(n)})}window._parseMoney=parseMoney})();

function appendStageRow(st){
  const nm=(st.name||'').trim(); const isZakupka=nm.toLowerCase()==='закупка';
  const isBoolOnly=['закупка','рубка','упаковка','отгрузка'].includes(nm.toLowerCase());
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td><input class="stg-name" data-k="name" type="text" value="${escapeHtml(nm)}" /></td>
    <td class="chk"><input class="ready-switch" data-k="done" type="checkbox" ${st.done?'checked':''}/></td>
    <td>${isBoolOnly?'<span class="muted">—</span>':`<input data-k="progress" type="number" min="0" max="100" value="${Number(st.progress??0)}" />`}</td>
    <td><input data-k="start" type="date" value="${escapeHtml(st.start||'')}" /></td>
    <td><input data-k="end" type="date" value="${escapeHtml(st.end||'')}" /></td>
    <td>${isZakupka?'<span class="muted">—</span>':`<div class="rowc" style="justify-content:center"><input data-k="value" type="number" step="0.01" value="${st.value??''}" placeholder="число" /><small class="muted tag-mini" data-orig></small></div>`}</td>
    <td class="chk"><button type="button" class="btn-circle danger" title="Удалить">✖</button></td>`;
  const origMap=window._editingOrigValues||null;
  if(origMap&&!isZakupka){const nameNow=nm||'Передел';const orig=Number(origMap[nameNow]);const box=tr.querySelector('[data-orig]');if(box&&Number.isFinite(orig))box.textContent=`(исх: ${orig.toLocaleString('ru-RU')})`}

  const delBtn=tr.querySelector('button'); delBtn.onclick=()=>{if(!confirm('Удалить передел?'))return;tr.remove();syncAutoProgress();syncAutoDates()};
  const progEl=tr.querySelector('[data-k="progress"]');const doneEl=tr.querySelector('[data-k="done"]');
  if(doneEl){doneEl.addEventListener('change',()=>{if(!isBoolOnly&&progEl){if(doneEl.checked)progEl.value=100; if(!doneEl.checked&&Number(progEl.value)==100)progEl.value=0} syncAutoProgress()})}
  if(progEl&&!isBoolOnly){progEl.addEventListener('input',e=>{const v=Number(e.target.value||0);if(v>=100&&doneEl)doneEl.checked=true;if(v<100&&doneEl&&doneEl.checked)doneEl.checked=false;syncAutoProgress()})}
  tr.querySelector('[data-k="start"]').addEventListener('change',syncAutoDates);
  tr.querySelector('[data-k="end"]').addEventListener('change',syncAutoDates);
  stagesTableBody.appendChild(tr); syncAutoProgress(); syncAutoDates();
}

function readStages(){
  const rows=[...stagesTableBody.querySelectorAll('tr')];
  return rows.map(r=>{const get=k=>r.querySelector(`[data-k="${k}"]`);
    const name=(get('name').value.trim()||'Передел'); const isZak=name.toLowerCase()==='закупка';
    const boolOnly=['закупка','рубка','упаковка','отгрузка'].includes(name.toLowerCase());
    const done=get('done').checked; const progEl=get('progress');
    const progress=boolOnly?(done?100:0):Math.max(0,Math.min(100,Number(progEl?.value||0)));
    return {name,done,progress,start:get('start').value||'',end:get('end').value||'',value:isZak?'':(get('value')?.value??'')}
  })
}

function calcAutoProgress(stages){const s=stages||[];if(!s.length)return 0;const avg=s.reduce((a,x)=>a+(Number(x.progress||0)),0)/s.length;return Math.round(avg)}
function syncAutoProgress(){orderForm.progress.value=calcAutoProgress(readStages())}
function syncAutoDates(){const s=readStages();const sd=s.map(x=>x.start).filter(Boolean).sort();const ed=s.map(x=>x.end).filter(Boolean).sort();orderForm.start.value=sd[0]||'';orderForm.end.value=ed[ed.length-1]||''}

orderForm.addEventListener('submit',async e=>{
  e.preventDefault(); const b=currentBoard(); if(!b){showToast('Не выбрана доска','error');return;}
  const id=orderForm.id.value||crypto.randomUUID(); const exist=b.orders.find(x=>x.id===id); const stages=readStages();
  const sd=stages.map(x=>x.start).filter(Boolean).sort(); const ed=stages.map(x=>x.end).filter(Boolean).sort();
  const startAuto=sd[0]||''; const endAuto=ed[ed.length-1]||'';
  const obj={id,title:orderForm.title.value.trim(),orderNo:orderForm.orderNo.value.trim(),customer:orderForm.customer.value.trim(),
    start:startAuto,end:endAuto,done:orderDone.checked,progress:calcAutoProgress(stages),progressManual:false,
    notes:orderForm.notes.value.trim(),status:orderForm.status.value,
    serviceTotal:(()=>{const v=(window._parseMoney?.(orderForm.serviceTotal.value));return v===''?'':v})(),stages,
    createdAt:exist?.createdAt||new Date().toISOString(),partOfPct:exist?.partOfPct??null,restOfPct:exist?.restOfPct??null,
    parentId:exist?.parentId??null,childIds:exist?.childIds??[],_origValues:exist?._origValues??undefined,_origPctUsed:exist?._origPctUsed??undefined,
    serverId:exist?.serverId??null};
  if(obj.done)obj.progress=100; if(exist){Object.assign(exist,obj)}else{b.orders.push(obj)} save(); renderCards(); orderDlg.close();
  try{await syncOrderToServer(obj);}catch(err){console.error(err);showToast(err.message||'Не удалось сохранить на сервере','error');}
});

/* Настройки доски */
const boardDlg=$('#boardDlg'),boardForm=$('#boardForm'),deleteBoardBtn=$('#deleteBoardBtn');
function openBoard(){const b=currentBoard();boardForm.name.value=b.name;boardForm.lanes.value=b.lanes.join(', ');boardForm.id.value=b.id;boardDlg.showModal()}
function closeBoard(){boardDlg.close()}
boardForm.addEventListener('submit',e=>{e.preventDefault();const id=boardForm.id.value;const b=state.boards.find(x=>x.id===id);b.name=boardForm.name.value.trim()||'Доска';b.lanes=boardForm.lanes.value.split(',').map(s=>s.trim()).filter(Boolean);save();renderAll();boardDlg.close()});
deleteBoardBtn.onclick=()=>{const id=boardForm.id.value;if(state.boards.length<=1){alert('Нельзя удалить единственную доску');return}if(!confirm('Удалить эту доску и все её заказы?'))return;state.boards=state.boards.filter(b=>b.id!==id);if(!state.boards.find(b=>b.id===state.currentBoardId)){state.currentBoardId=state.boards[0].id}save();renderAll();boardDlg.close()};

/* Разбивка на подзаказ */
const splitDlg=document.createElement('dialog'); splitDlg.id='splitDlg'; splitDlg.innerHTML=`
  <div class="dlg-head"><strong>Разбивка на подзаказ</strong><button class="ghost" onclick="document.getElementById('splitDlg').close()">✖</button></div>
  <form id="splitForm" class="dlg-body" method="dialog">
    <div class="rowc" style="gap:10px;flex-wrap:wrap">
      <div class="rowc" style="flex-direction:column;align-items:stretch"><label>Название подзаказа</label><input name="titlePart" placeholder="Напр.: Корпус Шкафа — часть 1"/></div>
      <div class="rowc" style="flex-direction:column;align-items:stretch"><label>% от основного</label><input name="partPct" type="number" min="1" max="99" value="50"/></div>
      <div class="rowc" style="flex-direction:column;align-items:stretch"><label>Суффикс №</label><input name="suffix" placeholder="-1"/></div>
    </div>
    <details open>
      <summary>Доли по переделам (опционально)</summary>
      <table id="splitStagesTable"><thead><tr><th>Передел</th><th style="width:22%">% доли</th></tr></thead><tbody></tbody></table>
      <small class="muted">Если указана хотя бы одна доля — общий % игнорируется. Для пустых долей — всё остаётся в основном заказе.</small>
    </details>
    <div class="rowc" style="justify-content:flex-end;gap:8px">
      <button type="button" onclick="document.getElementById('splitDlg').close()">Отмена</button>
      <button type="submit" class="primary">Создать подзаказ</button>
    </div>
  </form>`; document.body.appendChild(splitDlg);
const splitForm=splitDlg.querySelector('#splitForm'); const splitStagesTbody=splitDlg.querySelector('#splitStagesTable tbody'); let splitContextId=null;

function openSplitDialog(){
  const b=currentBoard(); const id=orderForm.id.value; const o=b.orders.find(x=>x.id===id)||null; splitContextId=id||null;
  splitForm.reset(); splitStagesTbody.innerHTML=''; const stages=readStages();
  stages.forEach(st=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${escapeHtml(st.name)}</td><td><input type="number" min="0" max="100" placeholder="" /></td>`;splitStagesTbody.appendChild(tr)});
  const defTitle=(orderForm.title.value.trim()||'Заказ')+' — часть'; splitForm.titlePart.value=defTitle; splitForm.suffix.value='-1'; splitForm.partPct.value=50;
  splitDlg.showModal();
}
splitForm.addEventListener('submit',e=>{
  e.preventDefault(); const b=currentBoard(); const parent=b.orders.find(x=>x.id===splitContextId); if(!parent){alert('Не удалось найти исходный заказ');return}
  const basePct=Math.max(1,Math.min(99,Number(splitForm.partPct.value||0))); const stageRows=[...splitStagesTbody.querySelectorAll('tr')]; const stageShares={};
  (parent.stages||[]).forEach((st,i)=>{const vRaw=stageRows[i]?.querySelector('input')?.value??'';const v=vRaw===''?NaN:Number(vRaw);if(!Number.isNaN(v)&&v>=0&&v<=100)stageShares[st.name]=v});
  const hasAnyStageShare=Object.keys(stageShares).length>0;
  if(!parent._origValues){parent._origValues=Object.fromEntries((parent.stages||[]).map(s=>[s.name,Number(s.value)||0]))}
  if(typeof parent._origPctUsed!=='number') parent._origPctUsed=0;

  const child=structuredClone(parent); child.id=crypto.randomUUID(); child.title=(splitForm.titlePart.value||parent.title+' — часть').trim();
  child.orderNo=parent.orderNo+(splitForm.suffix.value||'-1'); child.createdAt=new Date().toISOString();
  child.partOfPct=hasAnyStageShare?null:basePct; child.restOfPct=null; child.done=false; child.progress=0; child.progressManual=true;
  child.parentId=parent.id; child.isPart=true; parent.childIds=Array.isArray(parent.childIds)?parent.childIds:[]; parent.childIds.push(child.id);

  child.stages=(parent.stages||[]).map(st=>{const init=Number(parent._origValues?.[st.name]??st.value??0);const curr=Number(st.value??0);const share=hasAnyStageShare?(stageShares[st.name]??0):basePct; if(!Number.isFinite(init)||init<=0)return {...st}; let childWant=round(init*(share/100)); childWant=Math.min(childWant,curr); return {...st,value:childWant}});
  parent.stages=(parent.stages||[]).map(st=>{const init=Number(parent._origValues?.[st.name]??st.value??0);const curr=Number(st.value??0);const share=hasAnyStageShare?(stageShares[st.name]??0):basePct; if(!Number.isFinite(init)||init<=0)return {...st}; let childWant=round(init*(share/100)); childWant=Math.min(childWant,curr); const parentVal=round(curr-childWant); return {...st,value:parentVal}});

  if(!hasAnyStageShare){const allowed=Math.max(0,100-parent._origPctUsed);const used=Math.min(allowed,basePct);child.partOfPct=used;parent._origPctUsed+=used;parent.restOfPct=Math.max(0,100-parent._origPctUsed);if(parent.restOfPct===0)parent.restOfPct=null}else{child.partOfPct=null;parent.restOfPct=null}

  computeOrderDatesFromStages(child); computeOrderDatesFromStages(parent); child.progress=calcAutoProgress(child.stages); parent.progress=calcAutoProgress(parent.stages);
  b.orders.push(child); save(); renderCards(); splitDlg.close(); alert('Подзаказ создан и значения распределены.');
});
function round(n){return Math.round((n+Number.EPSILON)*100)/100}

/* TOP BAR & INIT */
$('#addBoardBtn').onclick=()=>{showToast('В этой версии поддерживается только одна доска (board_key="default").','warn');};
$('#editBoardBtn').onclick=openBoard; $('#newOrderBtn').onclick=()=>openOrder(null);
if(plannerBtn) plannerBtn.onclick=()=>{window.location.href='/planner';};
if(importCsvBtn) importCsvBtn.onclick=()=>{importCsvInput?.click();};
if(importCsvInput) importCsvInput.onchange=(e)=>{const file=e.target.files?.[0]; if(!file) return; if(!confirm('Импортировать CSV-файл в CRM? Текущие данные будут обновлены.')){e.target.value='';return;} file.text().then(text=>syncCsvImport(text)).catch(err=>showToast('Не удалось прочитать файл: '+err.message)).finally(()=>{e.target.value='';});};
if(exportCsvBtn) exportCsvBtn.onclick=()=>{exportCrmCsv();};
boardSelect.onchange=e=>{state.currentBoardId=e.target.value;save();renderAll()};
q.oninput=()=>renderCards();

$('#exportBtn').onclick=()=>{const data=JSON.stringify(state,null,2);const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mini_crm_export_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;a.click()};
$('#importBtn').addEventListener('click',()=>{showToast('Импорт JSON не синхронизируется с сервером. Для обмена используйте CSV.','warn');$('#importInput').click();});
$('#importInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const text=await f.text();const obj=JSON.parse(text);if(!obj?.boards?.length)throw new Error('Неверный формат');state=obj;save();renderAll();showToast('JSON импортирован локально. Данные не отправлены на сервер.','warn');}catch(err){console.error(err);showToast('Ошибка импорта JSON: '+err.message,'error');}finally{e.target.value=''}};

$('#exportBtn').insertAdjacentHTML('afterend','<button id="demoBtn" title="Загрузить демо">☆</button>');
$('#demoBtn').onclick=()=>{loadDemo();save();renderAll();alert('Загружено 12 демо-заказов')};

function loadDemo(){
  const b=currentBoard(); b.orders=[]; const lanes=b.lanes; const today=new Date(); today.setHours(0,0,0,0);
  const names=['Корпус шкафа','Панель фасадная','Кожух вентиляции','Стойка рамы','Лоток кабельный','Кронштейн опорный','Щит распределительный','Дверца ревизионная','Профиль С-образный','Балка связующая','Люк сервисный','Ступень лестничная'];
  for(let i=0;i<12;i++){
    const id=crypto.randomUUID(); const startShift=-10+Math.floor(Math.random()*15); const len=3+Math.floor(Math.random()*10);
    const s=new Date(today); s.setDate(s.getDate()+startShift); const e=new Date(s); e.setDate(e.getDate()+len);
    const st=DEFAULT_STAGES.map(n=>{const stS=new Date(s);stS.setDate(stS.getDate()+Math.floor(Math.random()*Math.max(1,len-1)));const stE=new Date(stS);stE.setDate(stE.getDate()+Math.floor(Math.random()*3));const done=Math.random()<0.4;const prog=done?100:Math.floor(Math.random()*80);const val=n.toLowerCase()==='закупка'?'':(Math.random()<0.5?(5+Math.floor(Math.random()*15)):'');return {name:n,done,progress:prog,start:fmtDate(stS),end:fmtDate(stE),value:val}});
    const order={id,title:names[i],orderNo:`24-${100+i}`,customer:['ООО Ромашка','ЗАО Лист','ИП Металл'][i%3],
      start:fmtDate(s),end:fmtDate(e),done:Math.random()<0.15,progress:Math.floor(Math.random()*100),progressManual:true,
      notes:'',status:lanes[Math.floor(Math.random()*lanes.length)],
      serviceTotal:Math.random()<0.6?(10000+Math.floor(Math.random()*90000)):'',stages:st,createdAt:new Date().toISOString()};
    b.orders.push(order);
  }
}

/* Ripple на кнопках */
document.addEventListener('click',e=>{
  const btn=e.target.closest('button'); if(btn){const rect=btn.getBoundingClientRect();const span=document.createElement('span');span.className='ripple';const size=Math.max(rect.width,rect.height);span.style.width=span.style.height=size+'px';const x=e.clientX-rect.left-size/2;const y=e.clientY-rect.top-size/2;span.style.left=x+'px';span.style.top=y+'px';btn.appendChild(span);span.addEventListener('animationend',()=>span.remove(),{once:true})}
});

/* INIT */
function renderAll(){renderBoardSelect();renderColumns();renderCards()}

function normalizeServiceTotal(value){if(value===''||value==null)return null;const parsed=window._parseMoney?.(value);if(parsed===''||Number.isNaN(parsed))return null;return Number(parsed);}

function stageKeyFromName(name){return (name||'').toLowerCase().replace(/[^a-z0-9а-яё]+/gi,'-').replace(/^-+|-+$/g,'')||'stage';}

function mapServerStage(stage){return {id:`srv-stage-${stage.id}`,stageId:stage.id,name:stage.stageName||stage.stage_key||'Передел',done:!!stage.isReady,progress:Number(stage.percent??0),start:stage.dateStart||'',end:stage.dateEnd||'',value:stage.hours==null?'':stage.hours};}

function mapServerOrder(order){const stages=(order.stages||[]).map(mapServerStage);return {
  id:`srv-${order.id}`,
  serverId:order.id,
  title:order.title||'',
  orderNo:order.orderNo||'',
  customer:order.customer||'',
  start:order.start||'',
  end:order.end||'',
  done:!!order.isDone,
  progress:Number(order.percent??calcAutoProgress(stages)),
  progressManual:false,
  notes:order.notes||'',
  status:order.lane||DEFAULT_LANES[0],
  serviceTotal:order.serviceTotal===''||order.serviceTotal==null?'':Number(order.serviceTotal),
  stages,
  createdAt:order.createdAt||new Date().toISOString(),
  updatedAt:order.updatedAt||null,
  updatedBy:order.updatedBy||null,
  parentId:order.parentOrderId?`srv-${order.parentOrderId}`:null,
  childIds:[],
  partOfPct:null,
  restOfPct:null,
  _origValues:Object.fromEntries(stages.map(st=>[st.name,st.value??'']))
};}

function mapLocalOrderToServer(order){const parseId=(val)=>{if(!val)return null;const str=String(val);if(str.startsWith('srv-'))return Number(str.replace('srv-',''));const num=Number(str);return Number.isNaN(num)?null:num;};
  return {
    id:order.serverId??parseId(order.id),
    orderNo:order.orderNo,
    title:order.title,
    customer:order.customer,
    serviceTotal:normalizeServiceTotal(order.serviceTotal),
    lane:order.status||DEFAULT_LANES[0],
    isDone:!!order.done,
    parentOrderId:parseId(order.parentId),
    boardKey:'default',
    notes:order.notes||''
  };
}

function mapLocalStagesToServer(order){return (order.stages||[]).map(st=>({
  id:st.stageId??(typeof st.id==='string'&&st.id.startsWith('srv-stage-')?Number(st.id.replace('srv-stage-','')):Number(st.id)||null),
  stageName:st.name||'Передел',
  stageKey:stageKeyFromName(st.name||'Передел'),
  dateStart:st.start||'',
  dateEnd:st.end||'',
  percent:Number(st.progress??(st.done?100:0)),
  isReady:!!st.done,
  hours:st.value===''||st.value==null?null:Number(st.value)
}));}

async function pullFromServer(){
  if(remoteSync.refreshing)return; remoteSync.refreshing=true;
  try{
    const res=await fetch('/api/crm/state',{headers:{'Accept':'application/json'}});
    if(res.status===401){window.location.href='/login.html';return;}
    if(!res.ok){throw new Error('HTTP '+res.status);}
    const data=await res.json();
    applyServerSnapshot(data?.board||data);
    updateConnectionStatus(true);
  }catch(err){console.error('fetch CRM state failed',err);updateConnectionStatus(false);}
  finally{remoteSync.refreshing=false;}
}

function applyServerSnapshot(board){if(!board)return;const lanes=(board.lanes&&board.lanes.length?board.lanes:[...DEFAULT_LANES]);const orders=(board.orders||[]).map(mapServerOrder);
  state.boards=[{id:'server-default',name:board.name||'Список заказов',lanes:[...lanes],orders}];
  state.currentBoardId='server-default';
  save();renderAll();renderCards();}

async function syncOrderToServer(order,opts={}){try{
    const payload={order:mapLocalOrderToServer(order),stages:mapLocalStagesToServer(order)};
    const res=await fetch('/api/crm/orders',{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});
    if(res.status===401){window.location.href='/login.html';return;}
    if(!res.ok){const detail=await res.json().catch(()=>({}));throw new Error(detail.error||'Сервер вернул ошибку');}
    const data=await res.json();
    if(data?.state?.board){applyServerSnapshot(data.state.board);}
    if(!opts.silent) showToast('Заказ сохранён', 'success');
  }catch(err){updateConnectionStatus(false);throw err;}}

async function syncDeleteOrder(order){const payload={order:mapLocalOrderToServer(order),delete:true};const res=await fetch('/api/crm/orders',{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});
  if(res.status===401){window.location.href='/login.html';return;}
  if(!res.ok){const detail=await res.json().catch(()=>({}));throw new Error(detail.error||'Ошибка удаления');}
  const data=await res.json();if(data?.state?.board)applyServerSnapshot(data.state.board);showToast('Заказ удалён','success');}

async function syncCsvImport(text){try{const res=await fetch('/api/crm/import_csv',{method:'POST',headers:{'Content-Type':'text/csv','Accept':'application/json'},body:text});if(res.status===401){window.location.href='/login.html';return;}if(!res.ok){const detail=await res.json().catch(()=>({}));throw new Error(detail.error||'Ошибка импорта CSV');}const data=await res.json();showToast(`Импортировано заказов: ${data?.processed?.length??0}`,'success');await pullFromServer();}catch(err){showToast(err.message||'CSV импорт не выполнен','error');}}

async function exportCrmCsv(){try{const res=await fetch('/api/crm/export_csv');if(res.status===401){window.location.href='/login.html';return;}if(!res.ok){const detail=await res.json().catch(()=>({}));throw new Error(detail.error||'Не удалось экспортировать CSV');}const blob=await res.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`crm_export_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);showToast('CSV экспортирован','success');}catch(err){showToast(err.message||'Не удалось экспортировать CSV','error');}}

function startFallbackPolling(){clearInterval(remoteSync.pollTimer);remoteSync.pollTimer=setInterval(()=>{if(remoteSync.offline)pullFromServer();},remoteSync.pollInterval);}

function stopFallbackPolling(){clearInterval(remoteSync.pollTimer);remoteSync.pollTimer=null;}

function connectSse(){if(!('EventSource'in window))return; if(remoteSync.sse)try{remoteSync.sse.close();}catch(_err){}
  const es=new EventSource('/api/events'); remoteSync.sse=es; updateConnectionStatus(true); stopFallbackPolling();
  es.onmessage=(event)=>{if(!event?.data)return; try{const payload=JSON.parse(event.data); if(payload?.type==='state-snapshot'&&payload?.mode==='crm'){const boardPayload=payload.board||payload.state?.board||payload.state; applyServerSnapshot(boardPayload); updateConnectionStatus(true);} else if(payload?.entity==='order'||payload?.entity==='stage'){scheduleRefresh(350);} }catch(err){console.warn('SSE parse failed',err);} };
  es.onerror=()=>{updateConnectionStatus(false);startFallbackPolling();setTimeout(connectSse,4000);};
}

async function bootstrapRemote(){try{const res=await fetch('/api/auth/me',{headers:{'Accept':'application/json'}});if(res.ok){const data=await res.json();remoteSync.user=data?.user||null;}else{updateConnectionStatus(false);} }catch(err){console.warn('auth check failed',err);}
  await pullFromServer();
  connectSse();
}
renderAll();
bootstrapRemote();

document.addEventListener('keydown',e=>{
  if(e.key==='n'&&(e.ctrlKey||e.metaKey)){e.preventDefault();openOrder(null)}
  if(e.key==='f'&&(e.ctrlKey||e.metaKey)){e.preventDefault();q.focus()}
});
</script>
